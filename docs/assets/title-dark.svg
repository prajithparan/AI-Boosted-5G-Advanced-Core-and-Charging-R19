  </style>
  <text class="t" x="490" y="47" text-anchor="middle">
    <tspan fill="#22D3EE">AI-Boosted</tspan><tspan fill="#94A3B8"> </tspan><tspan fill="#E2E8F0">5G-Advanced Core and Charging</tspan><tspan fill="#94A3B8"> — R19</tspan>
