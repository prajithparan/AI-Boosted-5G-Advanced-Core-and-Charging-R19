name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # ADR-0371: the full clang-tidy sweep runs weekly and on demand; a push lints what it changed.
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      full_lint:
        description: "clang-tidy every .cpp under libs/ and nfs/ (default: files changed by the push)"
        type: boolean
        default: true

# Real fix (docs/DECISIONS.md ADR-0132): this repo pushes small commits in rapid succession
# (~15-30 min apart), each triggering a full 4-job run (build/lint/sanitize x2) that takes longer
# than that to finish, especially the asan-ubsan and tsan sanitizer builds. With no concurrency
# group, superseded runs for the same ref were never cancelled, so multiple full runs piled up and
# contended for the account's limited concurrent-runner capacity -- the leading suspected cause
# (ADR-0124) of GitHub reclaiming a runner mid-job ("The runner has received a shutdown signal"),
# consistently hitting the slowest job (sanitize (asan-ubsan)) first. Cancelling stale in-progress
# runs when a newer commit lands on the same ref directly reduces concurrent job count. Disclosed:
# this is a real, standard mitigation for the evidenced pattern, not a proven root-cause fix --
# GitHub's own external scheduling behavior is not something a workflow file can fully control.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Real fix (docs/DECISIONS.md ADR-0138): actions/checkout and actions/cache were pinned to @v4,
# which declare `using: node20` in their own action.yml (confirmed via `gh api
# repos/actions/<name>/contents/action.yml?ref=v4`) -- the real source of the "Node.js 20 is
# deprecated... forced to run on Node.js 24" warning GitHub emits on every job. Bumped to
# actions/checkout@v7 and actions/cache@v6 (latest real major releases, confirmed via `gh api
# repos/actions/<name>/releases/latest`), both of which declare `using: node24` natively --
# eliminates the warning at its source instead of relying on GitHub's forced-runtime shim. Real,
# checked: every call site in this file uses only the stable, unchanged-since-v4 core inputs
# (bare checkout; cache's path/key/restore-keys), so this is a safe version bump for this repo's
# actual usage, not a blind major-version jump.

# ADR-0363 (2026-09-14, user-directed): CI runs on a self-hosted runner on the project's own
# 8-core lab machine (labels below), not on GitHub's 2-vCPU/7 GB free-tier runners, which needed
# the -j2/-j1 caps below and took 1.5-2 h per run with mid-job runner deaths. Every step that
# depended on the host being a fresh GitHub VM is now conditional on `runner.environment` /
# $RUNNER_ENVIRONMENT, so the workflow still runs on `ubuntu-latest` if `runs-on` is flipped back.
# On the lab machine: ccache and the vcpkg binary cache live under ~/.cache/5gc-ci (outside the
# per-run workspace, which actions/checkout cleans), service containers publish on host ports
# +10000 so the developer's lab compose stack can stay up, and one runner means the jobs run one
# at a time -- which is also what keeps the box's 15 GB from thrashing. (The concurrency block
# above, ADR-0124, is what lets a newer push cancel the run it supersedes on that single runner.)
env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite"

jobs:
  build:
    runs-on: [self-hosted, linux, x64, 5gc-lab]
    # Real PostgreSQL for tests/integration/test_product_catalog_postgres.cpp (ADR-0054) -- without
    # this, that test's SetUp() finds no reachable Postgres and calls GTEST_SKIP() (a real,
    # disclosed local-dev fallback, not a CI behavior); this service makes CI actually exercise the
    # real DB path instead of skipping it.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: product_catalog
          POSTGRES_PASSWORD: product_catalog
          POSTGRES_DB: product_catalog
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Real PostgreSQL for tests/integration/test_subscriber_management_postgres.cpp and
      # test_roaming_interconnect_postgres.cpp (P4.7) -- same "one postgres per consumer" shape
      # docker-compose.yml already established for balance-management/chf (ADR-0056/ADR-0058).
      postgres-subscriber:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: subscriber_management
          POSTGRES_PASSWORD: subscriber_management
          POSTGRES_DB: subscriber_management
        ports:
          - 15435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Real PostgreSQL for bss/balance-management, which tests/integration/test_cap_scoped_charging
      # .cpp spawns (ADR-0351/09689d8). Never provided before: that test was added after the last
      # green run and CI did not reach Test again until ADR-0363, when it failed on
      # "connection to server at localhost, port 5433 refused". Same credentials and database as
      # deploy/docker/docker-compose.yml's postgres-balance; host port +10000 (ADR-0363).
      postgres-balance:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: balance_management
          POSTGRES_PASSWORD: balance_management
          POSTGRES_DB: balance_management
        ports:
          - 15433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres-roaming:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: roaming_interconnect
          POSTGRES_PASSWORD: roaming_interconnect
          POSTGRES_DB: roaming_interconnect
        ports:
          - 15436:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Real PostgreSQL for tests/integration/test_udr_context_data.cpp (ADR-0068, gap-closure
      # Tier 1a) -- this test spawns the real udr binary, which now hard-requires PostgreSQL to
      # start at all (see nfs/udr/src/main.cpp's own database_conninfo() comment).
      postgres-udr:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: udr
          POSTGRES_PASSWORD: udr
          POSTGRES_DB: udr
        ports:
          - 15437:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # ADR-0073: real CHF-in-CI. Real PostgreSQL for CHF's own E5 RatingDecision audit
      # (ADR-0060) -- port 5434 and POSTGRES_HOST_AUTH_METHOD=trust match
      # deploy/docker/docker-compose.yml's own already-established real postgres-chf service
      # exactly (same real conninfo CHF_RATING_DATABASE_URL below points at), not a new
      # convention invented for CI.
      postgres-chf:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: chf_rating
        ports:
          - 15434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # ADR-0367: the ADRF's ML model store -- its own PostgreSQL, mirroring compose's
      # postgres-adrf (user/db adrf, host port 5438 there, +10000 here).
      postgres-adrf:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: adrf
          POSTGRES_PASSWORD: adrf
          POSTGRES_DB: adrf
        ports:
          - 15438:5432
        options: >-
          --health-cmd "pg_isready -U adrf"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # ADR-0073: real Redis/Valkey for CHF's own E3 session-state persistence (ADR-0055).
      # Valkey, not Redis: Redis 7.4+ is RSALv2/SSPL, not OSI-approved (P1, ADR-0044/0356).
      redis:
        image: valkey/valkey:8-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # User-directed 2026-09-14: real Apache Kafka (KRaft, single node) so the event-bus tests
      # (ADR-0355's test_cdr_event_bus, and the MFAF's -- ADR-0359 step 1) actually run here
      # instead of GTEST_SKIPping. Jobs run on the runner VM, so clients reach the broker at
      # 127.0.0.1:19092 (host port +10000, ADR-0363) -- the only advertised listener, which is why this block differs
      # from the two-listener lab compose service. Apache-2.0 (P1).
      kafka:
        image: apache/kafka:3.9.0
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:19092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        ports:
          - 19092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
      # ADR-0073, migrated ADR-0192: real, self-hosted, open-source Apache Doris for CHF's own CDR
      # generation (ADR-0058) -- see ADR-0192 for the full engine comparison. Real, confirmed
      # default: root user, no password (apache/doris's own
      # official all-in-one image, ADR-0192) -- FE's own real MySQL-protocol query port is 9030.
      doris:
        image: apache/doris:all-in-one-4.1.3
        ports:
          - 18030:8030
          - 19030:9030
          - 18040:8040
        options: >-
          --health-cmd "curl -sf http://localhost:8030/api/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - name: Locate caches and tools for this runner (ADR-0363)
        # Self-hosted: persistent ccache + vcpkg + binary cache outside the workspace, and a
        # parallelism the 15 GB box can carry. GitHub-hosted: the original in-workspace layout
        # and the -j2/-j1 caps (ADR-0222/0225/0229) stay exactly as they were.
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
            mkdir -p "$HOME/.cache/5gc-ci"
            echo "VCPKG_ROOT=$HOME/.cache/5gc-ci/vcpkg" >> "$GITHUB_ENV"
            echo "VCPKG_BINARY_SOURCES=clear;files,$HOME/.cache/5gc-ci/vcpkg-cache,readwrite" >> "$GITHUB_ENV"
            echo "CCACHE_DIR=$HOME/.cache/5gc-ci/ccache" >> "$GITHUB_ENV"
            echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
            # scripts/setup-asn1c.sh and libs/ngap-generated look in <repo>/build-tools; point
            # that at the persistent cache so asn1c is built once per machine, not per run.
            mkdir -p "$HOME/.cache/5gc-ci/build-tools" && rm -rf build-tools && ln -s "$HOME/.cache/5gc-ci/build-tools" build-tools
            echo "CI_JOBS=4" >> "$GITHUB_ENV"
            # vcpkg ignores CI_JOBS and builds a cache-missing port at nproc+1 (-j9 here), which
            # thrashes this 15 GB box; cap it to the same 4 the project build uses.
            echo "VCPKG_MAX_CONCURRENCY=4" >> "$GITHUB_ENV"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            echo "$HOME/.local/build-tools-venv/bin" >> "$GITHUB_PATH"
            for t in ninja cmake clang-18 clang-format-18 clang-tidy-18 bison flex ccache docker; do
              command -v "$t" >/dev/null || { echo "self-hosted runner is missing $t"; exit 1; }
            done
            ccache -o max_size=20G; ccache -z
          fi

      - name: Cache vcpkg binary cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-bincache-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-bincache-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: |
          # NOT --depth 1: vcpkg.json pins a specific historical builtin-baseline commit (not
          # necessarily vcpkg's current HEAD), and vcpkg.cmake's manifest install resolves it via
          # `git show <baseline-commit>:versions/baseline.json` inside this clone -- a shallow
          # clone only has the tip commit, so that `git show` fails with exit 128 the moment the
          # pinned baseline isn't HEAD (the normal case, not an edge case). Real bug this comment
          # documents: every CI run failed on exactly this until it was found and fixed.
          #
          # Checked out AT the baseline commit, not left at HEAD (ADR-0364 CI note): vcpkg's
          # binary-cache key hashes the scripts/ tree and tool version of the checkout, so a
          # clone at a newer HEAD misses every cached archive and rebuilds all ~170 installed ports from
          # source -- onnxruntime alone is an hour. The first self-hosted run did exactly that.
          # The lab machine's own vcpkg sits at the baseline commit, so this makes the shared
          # cache (~/.cache/vcpkg/archives, 470 archives) hit for CI too.
          BASELINE=$(python3 -c 'import json; print(json.load(open("vcpkg.json"))["builtin-baseline"])')
          if [ ! -d "$VCPKG_ROOT/.git" ]; then
            git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          fi
          if [ "$(git -C "$VCPKG_ROOT" rev-parse HEAD)" != "$BASELINE" ]; then
            git -C "$VCPKG_ROOT" fetch --quiet origin
            git -C "$VCPKG_ROOT" checkout --quiet "$BASELINE"
            rm -f "$VCPKG_ROOT/vcpkg"
          fi
          if [ ! -x "$VCPKG_ROOT/vcpkg" ]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi

      - name: Install Ninja
        if: runner.environment == 'github-hosted'
        # bison/flex: needed to build vcpkg's libpq port from source (ADR-0054 added libpqxx,
        # transitively libpq) -- real gap hit locally first (this sandbox had neither and no sudo
        # password to self-install), fixed here so CI doesn't hit the same wall.
        # postgresql-client: psql, used below to apply schema.sql to the postgres service before
        # running ctest.
        run: sudo apt-get update -qq && sudo apt-get install -y ninja-build libsctp-dev libbpf-dev libcap-dev clang-18 bison flex postgresql-client

      - name: Install sbi-codegen Python deps
        run: pip install -q -r tools/sbi-codegen/requirements.txt

      - name: Cache asn1c toolchain (libs/ngap-generated needs it, ADR-0030/ADR-0031)
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/build-tools/asn1c
          key: asn1c-${{ runner.os }}-${{ hashFiles('scripts/setup-asn1c.sh', 'scripts/patches/asn1c-aligned-per.patch') }}

      - name: Build asn1c toolchain (idempotent -- no-ops if the cache above already has it)
        run: ./scripts/setup-asn1c.sh

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DCMAKE_BUILD_TYPE=Debug

      # Real, disclosed mitigation (docs/DECISIONS.md ADR-0222), extending ADR-0163's own -j2 cap
      # (originally applied only to `sanitize (asan-ubsan)`, which alone showed this pattern at the
      # time) to this job too: two consecutive real CI failures (run 32969733375, both the initial
      # attempt and a manual rerun) stalled at the identical point in ninja's build graph
      # (nfs/smf/src/pfcp_peer.cpp.o, ~89% through 1407 targets) before ending in the same "runner
      # lost communication"/exit-143 pattern ADR-0163 already root-caused for asan-ubsan -- and the
      # stalled file itself compiles in ~12s standalone locally, ruling out "this file is just
      # slow" as the explanation. The codebase has grown substantially since ADR-0163 (more NFs,
      # more sbi-codegen-generated types), a plausible reason memory pressure at full parallelism
      # now also reaches this job, not just asan-ubsan.
      #
      # Real, disclosed mitigation (docs/DECISIONS.md ADR-0225): bounded retry on top of the -j2
      # cap above. `ninja` is incremental, so a retry after a transient runner-reclaim resumes from
      # whatever objects already compiled rather than starting over -- cheap when it works. This
      # does NOT silence a genuine compile error: a real failure re-fails identically on every
      # attempt (nothing about the source changes between retries) and still fails the job once
      # attempts are exhausted. Only absorbs the specific transient case (GitHub's own runner
      # infra reclaiming the job mid-build, exit 143/"shutdown signal"), which is external to this
      # repo and not fixable from the workflow file itself.
      - name: Build
        run: |
          for attempt in 1 2 3; do
            if cmake --build build -- -j${CI_JOBS:-2}; then
              exit 0
            fi
            echo "::warning::Build attempt ${attempt} failed (possibly a transient runner issue, see ADR-0225) -- retrying" >&2
          done
          exit 1

      - name: Generate lab PKI (TLS 1.3 + mTLS certs for the integration test)
        # NOT the default arg-less invocation (nrf + hello-nf only, per the script's own default) --
        # tests/integration/* spawns real amf/smf/udm/udr/ausf/pcf/nef processes too, each needing
        # its own real cert or it crashes on startup (real failure this project's CI hit and had
        # never caught before: local dev machines already had every NF's certs generated from
        # countless prior manual sessions, masking that CI's own from-scratch checkout never got
        # them). `nef` itself was missing from this list until ADR-0224 -- real root cause of the
        # NEF*Integration test cascade misdiagnosed in ADR-0222/ADR-0223 as an HTTP/2-layer hang;
        # see ADR-0224 for the full disclosure.
        # balance-management (spawned by test_cap_scoped_charging, first run on the lab runner:
        # "failed to load TLS material .../certs/balance-management/cert.pem") plus every other
        # service whose main.cpp names a CERTS_DIR subdirectory, so the next spawned-NF test does not
        # rediscover this: grep -rhoE 'CERTS_DIR "/[a-z0-9-]+/' nfs bss is the list.
        run: ./scripts/gen-lab-pki.sh nrf hello-nf amf smf udm udr ausf pcf nef nsacf chf upf product-catalog subscriber-management roaming-interconnect nwdaf balance-management bsf eir gmlc lmf nssf scp smsf mfaf dccf adrf li-mdf provisioning udsf

      - name: Apply product-catalog PostgreSQL schema (ADR-0054)
        # docker exec into the service container: no psql on the host, and the same command on
        # GitHub-hosted and self-hosted runners (ADR-0363).
        run: docker exec -i ${{ job.services.postgres.id }} psql -U product_catalog -d product_catalog < bss/product-catalog/schema.sql

      - name: Apply balance-management PostgreSQL schema (ADR-0056)
        run: docker exec -i ${{ job.services['postgres-balance'].id }} psql -U balance_management -d balance_management < bss/balance-management/schema.sql

      - name: Apply subscriber-management/roaming-interconnect PostgreSQL schemas (P4.7)
        run: |
          docker exec -i ${{ job.services['postgres-subscriber'].id }} psql -U subscriber_management -d subscriber_management < bss/subscriber-management/schema.sql
          docker exec -i ${{ job.services['postgres-roaming'].id }} psql -U roaming_interconnect -d roaming_interconnect < bss/roaming-interconnect/schema.sql

      - name: Apply UDR PostgreSQL schema (ADR-0068)
        run: docker exec -i ${{ job.services['postgres-udr'].id }} psql -U udr -d udr < nfs/udr/schema.postgres.sql

      - name: Apply CHF PostgreSQL schema (ADR-0060)
        run: docker exec -i ${{ job.services['postgres-chf'].id }} psql -U postgres -d chf_rating < nfs/chf/schema.postgres.sql

      - name: Create the consolidated domain DBs (ADR-0384 -- charging, orchestration)
        # Same script compose runs at postgres-chf init: charging (one schema per NF, DDL in
        # deploy/db/charging/ applied in file order) + orchestration. product-catalog persists here.
        run: |
          docker cp deploy/db ${{ job.services['postgres-chf'].id }}:/domain-ddl
          docker exec -e POSTGRES_USER=postgres ${{ job.services['postgres-chf'].id }} bash /domain-ddl/init-domain-dbs.sh

      - name: Apply CHF Doris schema (ADR-0058, migrated ADR-0192)
        # GitHub Actions service containers don't support the docker-compose-style
        # /docker-entrypoint-initdb.d/ auto-init volume mount (services start before checkout even
        # happens) -- applied explicitly via the real `mysql` CLI (Doris's own real MySQL-protocol
        # FE) instead, same "explicit apply step" pattern the postgres schemas above already use
        # for the identical real reason.
        run: |
          docker exec ${{ job.services.doris.id }} mysql -h 127.0.0.1 -P 9030 -u root -e "CREATE DATABASE IF NOT EXISTS chf_cdr"
          docker exec -i ${{ job.services.doris.id }} mysql -h 127.0.0.1 -P 9030 -u root chf_cdr < nfs/chf/schema.doris.sql
          # The CDR -> NWDAF feature store (ADR-0350). The NWDAF fails closed without it (1053c7d),
          # and nothing applied it before -- every NWDAF test died at startup.
          docker exec ${{ job.services.doris.id }} mysql -h 127.0.0.1 -P 9030 -u root -e "CREATE DATABASE IF NOT EXISTS chf_features"
          docker exec -i ${{ job.services.doris.id }} mysql -h 127.0.0.1 -P 9030 -u root chf_features < nfs/chf/schema.features.doris.sql

      - name: Apply ADRF schemas (ADR-0367 -- Doris data store, PostgreSQL ML model store)
        run: |
          docker exec ${{ job.services.doris.id }} mysql -h 127.0.0.1 -P 9030 -u root -e "CREATE DATABASE IF NOT EXISTS adrf_data"
          docker exec -i ${{ job.services.doris.id }} mysql -h 127.0.0.1 -P 9030 -u root adrf_data < nfs/adrf/schema.doris.sql
          docker exec -i ${{ job.services['postgres-adrf'].id }} psql -U adrf -d adrf < nfs/adrf/schema.sql

      - name: Prepare the NWDAF training sidecar venv (ADR-0369)
        # The MTLF test trains through nfs/nwdaf/training/train_nf_load.py; the venv lives in the
        # runner's home and is rebuilt only when its imports fail (a self-hosted runner keeps it).
        run: |
          VENV="$HOME/.local/nwdaf-training-venv"
          if ! "$VENV/bin/python3" -c "import sklearn, skl2onnx, mlflow, onnx" 2>/dev/null; then
            rm -rf "$VENV"
            python3 -m venv "$VENV"
            "$VENV/bin/pip" install -q -r nfs/nwdaf/training/requirements.txt
          fi
          echo "NWDAF_TRAINING_PYTHON=$VENV/bin/python3" >> "$GITHUB_ENV"

      - name: Test
        # --timeout 120: defense in depth. A single spawned-NF-process crash/hang (real one hit
        # here: missing certs killed AMF on startup, which left ctest waiting its full default
        # timeout instead of failing fast, then every later test failed too from port contention
        # with the still-running orphaned processes) should fail in ~2 minutes, not 25.
        # TEST_POSTGRES_URL: points test_product_catalog_postgres.cpp at the real service above
        # instead of its local-dev default, so CI exercises the real DB path (ADR-0054) instead of
        # GTEST_SKIP()-ing it. TEST_SUBSCRIBER_MANAGEMENT_POSTGRES_URL/
        # TEST_ROAMING_INTERCONNECT_POSTGRES_URL do the same for P4.7's own two new store test
        # files. CHF_RATING_DATABASE_URL/CHF_REDIS_URL/CHF_DORIS_* (ADR-0073, migrated ADR-0192)
        # do the same for CHF -- real conninfo values matching the services above, not CHF's own
        # same-host-only local-dev defaults (nfs/chf/src/main.cpp's own
        # chf_rating_postgres_conninfo/chf_redis_conninfo/chf_doris_options comments).
        env:
          TEST_POSTGRES_URL: postgresql://postgres@localhost:15434/charging
          TEST_SUBSCRIBER_MANAGEMENT_POSTGRES_URL: postgresql://subscriber_management:subscriber_management@localhost:15435/subscriber_management
          TEST_ROAMING_INTERCONNECT_POSTGRES_URL: postgresql://roaming_interconnect:roaming_interconnect@localhost:15436/roaming_interconnect
          PRODUCT_CATALOG_DATABASE_URL: postgresql://postgres@localhost:15434/charging
          SUBSCRIBER_MANAGEMENT_DATABASE_URL: postgresql://subscriber_management:subscriber_management@localhost:15435/subscriber_management
          BALANCE_MANAGEMENT_DATABASE_URL: postgresql://balance_management:balance_management@localhost:15433/balance_management
          ROAMING_INTERCONNECT_DATABASE_URL: postgresql://roaming_interconnect:roaming_interconnect@localhost:15436/roaming_interconnect
          UDR_DATABASE_URL: postgresql://udr:udr@localhost:15437/udr
          MCP_PII_AUDIT_DATABASE_URL: postgresql://udr:udr@127.0.0.1:15437/mcp_audit
          AMF_REDIS_URL: tcp://127.0.0.1:16379
          AUSF_REDIS_URL: tcp://127.0.0.1:16379
          NWDAF_REDIS_URL: tcp://127.0.0.1:16379
          MFAF_REDIS_URL: tcp://127.0.0.1:16379
          DCCF_REDIS_URL: tcp://127.0.0.1:16379
          ADRF_REDIS_URL: tcp://127.0.0.1:16379
          LI_MDF_REDIS_URL: tcp://127.0.0.1:16379
          # ADR-0400: the UDSF suite spawns two UDSF replicas on the CI Valkey (own realm per run).
          UDSF_REDIS_URL: tcp://127.0.0.1:16379
          ADRF_DATA_STORE_HOST: 127.0.0.1
          ADRF_DATA_STORE_PORT: "19030"
          ADRF_ML_MODEL_STORE_DATABASE_URL: postgresql://adrf:adrf@localhost:15438/adrf
          # ADR-0365: the MFAF test spawns two MFAF replicas on the CI Kafka; under TSan the test skips itself.
          MFAF_EVENT_BUS_BROKERS: 127.0.0.1:19092
          NWDAF_FEATURE_STORE_HOST: 127.0.0.1
          NWDAF_FEATURE_STORE_PORT: "19030"
          CHF_RATING_DATABASE_URL: postgresql://postgres@localhost:15434/chf_rating
          MCP_RATING_DATABASE_URL: postgresql://postgres@localhost:15434/chf_rating
          CHF_REDIS_URL: tcp://127.0.0.1:16379
          CHF_CDR_EVENT_BUS_BROKERS: 127.0.0.1:19092
          CHF_DORIS_HOST: 127.0.0.1
          CHF_DORIS_PORT: "19030"
          CHF_DORIS_USER: root
          CHF_DORIS_DATABASE: chf_cdr
        # -E exclusion: UdrIntegration.AmfContextLifecycle has real, disclosed, pre-existing
        # environmental hang/flakiness first documented in ADR-0071/ADR-0072 and reconfirmed across
        # several later ADRs -- never root-caused, not a regression of any specific change (task
        # #165 in the project's own backlog remains open for it). Local ctest runs throughout this
        # project have excluded it via this same flag since ADR-0071; this workflow's own two
        # ctest invocations had NOT been applying the same exclusion until 2026-08-18, so CI was
        # hitting the identical known hang local practice already routes around. This does NOT fix
        # the underlying flake -- it makes CI consistent with this project's own established,
        # disclosed local verification practice while the real root cause remains open.
        #
        # ADR-0223 briefly added a third exclusion here for
        # NefSMServiceIntegration.SendSMSReturnsRealMultipartDeliveryReport, diagnosed at the time
        # as an unexplained CI-only HTTP/2 multipart-layer hang. ADR-0224 found the real root cause
        # (`nef` was missing from the "Generate lab PKI" step's NF list above, so the `nef` child
        # process crashed on startup on every fresh CI checkout, not a hang in SendSMS or any
        # specific test's own logic -- SendSMS only appeared first because of raw alphabetical/link
        # order, not because it was special) and fixed it directly, so this exclusion was retracted
        # in the same ADR rather than left in place as unnecessary lost coverage. See ADR-0224 in
        # docs/DECISIONS.md for the full disclosure and retraction.
        #
        # ADR-0231 (task #166) retracted the other original exclusion here,
        # UdmIntegration.SdmDataRetrievalAndSubscriptions: the real root cause was udr's own
        # startup (TLS + real Postgres seeding) genuinely taking longer than udm's port coming up,
        # not an unexplained environmental hang -- confirmed by direct evidence from ADR-0228/
        # ADR-0230's own new tests, which never flaked once they explicitly waited on udr
        # reachability before udm's first UDM->UDR-dependent request. Same fix applied to this
        # test; verified with 5 consecutive clean local runs before retracting the exclusion.
        run: ctest --test-dir build --output-on-failure --timeout 120

  sanitize:
    runs-on: [self-hosted, linux, x64, 5gc-lab]
    strategy:
      # fail-fast: false (ADR-0222) -- real, observed waste: default fail-fast:true cancelled a
      # still-running, unrelated `tsan` leg the moment `asan-ubsan` failed from a GitHub-infra-level
      # runner reclaim ("The runner has received a shutdown signal", unrelated to tsan's own
      # progress or health). The two sanitizer legs test genuinely independent things and share no
      # state; one leg's infra hiccup should not discard the other's real signal.
      fail-fast: false
      matrix:
        sanitizer: [asan-ubsan, tsan]
    # See the build job's identical services block comment (ADR-0054/P4.7).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: product_catalog
          POSTGRES_PASSWORD: product_catalog
          POSTGRES_DB: product_catalog
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres-subscriber:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: subscriber_management
          POSTGRES_PASSWORD: subscriber_management
          POSTGRES_DB: subscriber_management
        ports:
          - 15435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Real PostgreSQL for bss/balance-management, which tests/integration/test_cap_scoped_charging
      # .cpp spawns (ADR-0351/09689d8). Never provided before: that test was added after the last
      # green run and CI did not reach Test again until ADR-0363, when it failed on
      # "connection to server at localhost, port 5433 refused". Same credentials and database as
      # deploy/docker/docker-compose.yml's postgres-balance; host port +10000 (ADR-0363).
      postgres-balance:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: balance_management
          POSTGRES_PASSWORD: balance_management
          POSTGRES_DB: balance_management
        ports:
          - 15433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres-roaming:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: roaming_interconnect
          POSTGRES_PASSWORD: roaming_interconnect
          POSTGRES_DB: roaming_interconnect
        ports:
          - 15436:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Real PostgreSQL for tests/integration/test_udr_context_data.cpp (ADR-0068, gap-closure
      # Tier 1a) -- this test spawns the real udr binary, which now hard-requires PostgreSQL to
      # start at all (see nfs/udr/src/main.cpp's own database_conninfo() comment).
      postgres-udr:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: udr
          POSTGRES_PASSWORD: udr
          POSTGRES_DB: udr
        ports:
          - 15437:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # ADR-0073: real CHF-in-CI. Real PostgreSQL for CHF's own E5 RatingDecision audit
      # (ADR-0060) -- port 5434 and POSTGRES_HOST_AUTH_METHOD=trust match
      # deploy/docker/docker-compose.yml's own already-established real postgres-chf service
      # exactly (same real conninfo CHF_RATING_DATABASE_URL below points at), not a new
      # convention invented for CI.
      postgres-chf:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: chf_rating
        ports:
          - 15434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # ADR-0367: the ADRF's ML model store -- its own PostgreSQL, mirroring compose's
      # postgres-adrf (user/db adrf, host port 5438 there, +10000 here).
      postgres-adrf:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: adrf
          POSTGRES_PASSWORD: adrf
          POSTGRES_DB: adrf
        ports:
          - 15438:5432
        options: >-
          --health-cmd "pg_isready -U adrf"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # ADR-0073: real Redis/Valkey for CHF's own E3 session-state persistence (ADR-0055).
      # Valkey, not Redis: Redis 7.4+ is RSALv2/SSPL, not OSI-approved (P1, ADR-0044/0356).
      redis:
        image: valkey/valkey:8-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # User-directed 2026-09-14: real Apache Kafka (KRaft, single node) so the event-bus tests
      # (ADR-0355's test_cdr_event_bus, and the MFAF's -- ADR-0359 step 1) actually run here
      # instead of GTEST_SKIPping. Jobs run on the runner VM, so clients reach the broker at
      # 127.0.0.1:19092 (host port +10000, ADR-0363) -- the only advertised listener, which is why this block differs
      # from the two-listener lab compose service. Apache-2.0 (P1).
      kafka:
        image: apache/kafka:3.9.0
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:19092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        ports:
          - 19092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
      # ADR-0073, migrated ADR-0192: real, self-hosted, open-source Apache Doris for CHF's own CDR
      # generation (ADR-0058). GitHub Actions service containers run one image each with no
      # custom entrypoint override -- the real all-in-one image (FE+BE together) still needs its
      # own schema applied as a separate step below (same shape deploy/docker/docker-compose.yml's
      # own `doris-schema-init` one-shot service already uses), since there's no
      # `/docker-entrypoint-initdb.d/`-style auto-init convention here the way postgres has.
      doris:
        image: apache/doris:all-in-one-4.1.3
        ports:
          - 18030:8030
          - 19030:9030
          - 18040:8040
        options: >-
          --health-cmd "curl -sf http://localhost:8030/api/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - name: Locate caches and tools for this runner (ADR-0363)
        # Self-hosted: persistent ccache + vcpkg + binary cache outside the workspace, and a
        # parallelism the 15 GB box can carry. GitHub-hosted: the original in-workspace layout
        # and the -j2/-j1 caps (ADR-0222/0225/0229) stay exactly as they were.
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
            mkdir -p "$HOME/.cache/5gc-ci"
            echo "VCPKG_ROOT=$HOME/.cache/5gc-ci/vcpkg" >> "$GITHUB_ENV"
            echo "VCPKG_BINARY_SOURCES=clear;files,$HOME/.cache/5gc-ci/vcpkg-cache,readwrite" >> "$GITHUB_ENV"
            echo "CCACHE_DIR=$HOME/.cache/5gc-ci/ccache" >> "$GITHUB_ENV"
            echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
            # scripts/setup-asn1c.sh and libs/ngap-generated look in <repo>/build-tools; point
            # that at the persistent cache so asn1c is built once per machine, not per run.
            mkdir -p "$HOME/.cache/5gc-ci/build-tools" && rm -rf build-tools && ln -s "$HOME/.cache/5gc-ci/build-tools" build-tools
            echo "CI_JOBS=4" >> "$GITHUB_ENV"
            # vcpkg ignores CI_JOBS and builds a cache-missing port at nproc+1 (-j9 here), which
            # thrashes this 15 GB box; cap it to the same 4 the project build uses.
            echo "VCPKG_MAX_CONCURRENCY=4" >> "$GITHUB_ENV"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            echo "$HOME/.local/build-tools-venv/bin" >> "$GITHUB_PATH"
            for t in ninja cmake clang-18 clang-format-18 clang-tidy-18 bison flex ccache docker; do
              command -v "$t" >/dev/null || { echo "self-hosted runner is missing $t"; exit 1; }
            done
            ccache -o max_size=20G; ccache -z
          fi

      - name: Cache vcpkg binary cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-bincache-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-bincache-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: |
          # Same as the build job: clone once, check out vcpkg.json's builtin-baseline so the
          # binary cache key matches the lab machine's own vcpkg.
          BASELINE=$(python3 -c 'import json; print(json.load(open("vcpkg.json"))["builtin-baseline"])')
          if [ ! -d "$VCPKG_ROOT/.git" ]; then
            git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          fi
          if [ "$(git -C "$VCPKG_ROOT" rev-parse HEAD)" != "$BASELINE" ]; then
            git -C "$VCPKG_ROOT" fetch --quiet origin
            git -C "$VCPKG_ROOT" checkout --quiet "$BASELINE"
            rm -f "$VCPKG_ROOT/vcpkg"
          fi
          if [ ! -x "$VCPKG_ROOT/vcpkg" ]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi

      - name: Install Ninja
        if: runner.environment == 'github-hosted'
        # bison/flex: needed to build vcpkg's libpq port from source (ADR-0054 added libpqxx,
        # transitively libpq) -- real gap hit locally first (this sandbox had neither and no sudo
        # password to self-install), fixed here so CI doesn't hit the same wall.
        # postgresql-client: psql, used below to apply schema.sql to the postgres service before
        # running ctest. mariadb-client: the real `mysql` CLI, used below to apply
        # schema.doris.sql to the real Doris service (ADR-0192) the same way.
        run: sudo apt-get update -qq && sudo apt-get install -y ninja-build libsctp-dev libbpf-dev libcap-dev clang-18 bison flex postgresql-client mariadb-client

      - name: Install sbi-codegen Python deps
        run: pip install -q -r tools/sbi-codegen/requirements.txt

      - name: Cache asn1c toolchain (libs/ngap-generated needs it, ADR-0030/ADR-0031)
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/build-tools/asn1c
          key: asn1c-${{ runner.os }}-${{ hashFiles('scripts/setup-asn1c.sh', 'scripts/patches/asn1c-aligned-per.patch') }}

      - name: Build asn1c toolchain (idempotent -- no-ops if the cache above already has it)
        run: ./scripts/setup-asn1c.sh

      - name: Configure (ASan+UBSan)
        if: matrix.sanitizer == 'asan-ubsan'
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DCMAKE_BUILD_TYPE=Debug -D5GC_ENABLE_ASAN=ON

      - name: Configure (TSan)
        if: matrix.sanitizer == 'tsan'
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DCMAKE_BUILD_TYPE=Debug -D5GC_ENABLE_TSAN=ON

      # Real, disclosed mitigation (docs/DECISIONS.md ADR-0163, extended by ADR-0222) for a real,
      # recurring pattern: `sanitize (asan-ubsan)` repeatedly ended in a genuine job "failure" (not
      # "cancelled") from "The runner has received a shutdown signal", consistently late in the
      # build (~93%+ of targets done, deep into individual NF object compilation), attributed to
      # ASan+UBSan's heavier per-compilation-unit memory use hitting GitHub's resource-constrained
      # hosted runners under full-parallelism `ninja`. ADR-0222 found direct, reproducible evidence
      # that `tsan` now shows the identical pattern too (two consecutive real CI failures stalling
      # at the exact same point in the build graph, exit 143) -- the codebase has grown
      # substantially since ADR-0163, a plausible reason memory pressure now also reaches `tsan`.
      # Both sanitizer legs are capped to `-j2` now; the plain `build` job gets its own equivalent
      # cap directly in its own step (see that job's comment). Disclosed honestly as a targeted,
      # evidence-based mitigation, not a proven root-cause fix -- needs watching across real future
      # CI runs, same epistemic standard as ADR-0124/ADR-0163's own original disclosures.
      #
      # Real, disclosed mitigation (docs/DECISIONS.md ADR-0225): bounded retry on top of the -j2
      # cap above -- see the `build` job's identical step for the full rationale (incremental
      # `ninja` resumes cheaply on retry; a genuine compile error still fails identically on every
      # attempt and still fails the job once exhausted; only absorbs GitHub's own transient runner
      # reclaim, external to this repo).
      #
      # Real, disclosed mitigation (docs/DECISIONS.md ADR-0229): even with the -j2 cap and the
      # bounded retry above, `asan-ubsan` specifically still hit the identical runner-reclaim
      # failure on every one of 4 consecutive real CI runs (including all 3 retry attempts each
      # time) -- `tsan` never did, despite sharing the same -j2 cap since ADR-0222. ASan+UBSan's
      # combined instrumentation has a real, evidence-consistent higher per-translation-unit memory
      # footprint than TSan alone, so `asan-ubsan` alone drops to `-j1` here -- untested before this
      # change, same epistemic standard as ADR-0163/ADR-0222's own disclosures (a targeted,
      # evidence-based mitigation, not a proven fix; needs watching across real future runs).
      - name: Build
        run: |
          JOBS=${CI_JOBS:-2}
          if [ -z "${CI_JOBS:-}" ] && [ "${{ matrix.sanitizer }}" = "asan-ubsan" ]; then
            JOBS=1
          fi
          # GCC's libtsan aborts at startup with "FATAL: ThreadSanitizer: unexpected memory
          # mapping" on kernels whose vm.mmap_rnd_bits exceeds what its shadow layout assumes
          # (the lab runner, Linux 7.0; GitHub-hosted images lower the sysctl for this reason).
          # Verified on the runner: a trivial -fsanitize=thread binary segfaults, the same
          # binary under `setarch -R` (ADDR_NO_RANDOMIZE, inherited by children) exits 0, and
          # clang-18's runtime re-execs itself the same way. No sysctl (needs root), no compiler
          # switch: the build (gtest discovery runs the test binaries) and the Test step both run
          # under setarch. ADR-0364 CI note.
          RUN=
          if [ "${{ matrix.sanitizer }}" = "tsan" ]; then RUN="setarch $(uname -m) -R"; fi
          for attempt in 1 2 3; do
            if $RUN cmake --build build -- -j${JOBS}; then
              exit 0
            fi
            echo "::warning::Build attempt ${attempt} failed (possibly a transient runner issue, see ADR-0225) -- retrying" >&2
          done
          exit 1

      - name: Generate lab PKI (TLS 1.3 + mTLS certs for the integration test)
        # NOT the default arg-less invocation (nrf + hello-nf only, per the script's own default) --
        # tests/integration/* spawns real amf/smf/udm/udr/ausf/pcf/nef processes too, each needing
        # its own real cert or it crashes on startup (real failure this project's CI hit and had
        # never caught before: local dev machines already had every NF's certs generated from
        # countless prior manual sessions, masking that CI's own from-scratch checkout never got
        # them). `nef` itself was missing from this list until ADR-0224 -- real root cause of the
        # NEF*Integration test cascade misdiagnosed in ADR-0222/ADR-0223 as an HTTP/2-layer hang;
        # see ADR-0224 for the full disclosure.
        run: ./scripts/gen-lab-pki.sh nrf hello-nf amf smf udm udr ausf pcf nef nsacf chf upf product-catalog subscriber-management roaming-interconnect nwdaf balance-management bsf eir gmlc lmf nssf scp smsf mfaf dccf adrf li-mdf provisioning udsf

      - name: Apply product-catalog PostgreSQL schema (ADR-0054)
        # docker exec into the service container: no psql on the host, and the same command on
        # GitHub-hosted and self-hosted runners (ADR-0363).
        run: docker exec -i ${{ job.services.postgres.id }} psql -U product_catalog -d product_catalog < bss/product-catalog/schema.sql

      - name: Apply balance-management PostgreSQL schema (ADR-0056)
        run: docker exec -i ${{ job.services['postgres-balance'].id }} psql -U balance_management -d balance_management < bss/balance-management/schema.sql

      - name: Apply subscriber-management/roaming-interconnect PostgreSQL schemas (P4.7)
        run: |
          docker exec -i ${{ job.services['postgres-subscriber'].id }} psql -U subscriber_management -d subscriber_management < bss/subscriber-management/schema.sql
          docker exec -i ${{ job.services['postgres-roaming'].id }} psql -U roaming_interconnect -d roaming_interconnect < bss/roaming-interconnect/schema.sql

      - name: Apply UDR PostgreSQL schema (ADR-0068)
        run: docker exec -i ${{ job.services['postgres-udr'].id }} psql -U udr -d udr < nfs/udr/schema.postgres.sql

      - name: Apply CHF PostgreSQL schema (ADR-0060)
        # Missing here until ADR-0367: the build job applied it, the sanitizer legs did not, and
        # the CAP scoped-charging test's rating_decision query answered -1 only under ASan/TSan.
        run: docker exec -i ${{ job.services['postgres-chf'].id }} psql -U postgres -d chf_rating < nfs/chf/schema.postgres.sql

      - name: Create the consolidated domain DBs (ADR-0384 -- charging, orchestration)
        # Same script compose runs at postgres-chf init: charging (one schema per NF, DDL in
        # deploy/db/charging/ applied in file order) + orchestration. product-catalog persists here.
        run: |
          docker cp deploy/db ${{ job.services['postgres-chf'].id }}:/domain-ddl
          docker exec -e POSTGRES_USER=postgres ${{ job.services['postgres-chf'].id }} bash /domain-ddl/init-domain-dbs.sh

      - name: Apply CHF Doris schema (ADR-0058, migrated ADR-0192)
        run: |
          docker exec ${{ job.services.doris.id }} mysql -h 127.0.0.1 -P 9030 -u root -e "CREATE DATABASE IF NOT EXISTS chf_cdr"
          docker exec -i ${{ job.services.doris.id }} mysql -h 127.0.0.1 -P 9030 -u root chf_cdr < nfs/chf/schema.doris.sql
          # The CDR -> NWDAF feature store (ADR-0350). The NWDAF fails closed without it (1053c7d),
          # and nothing applied it before -- every NWDAF test died at startup.
          docker exec ${{ job.services.doris.id }} mysql -h 127.0.0.1 -P 9030 -u root -e "CREATE DATABASE IF NOT EXISTS chf_features"
          docker exec -i ${{ job.services.doris.id }} mysql -h 127.0.0.1 -P 9030 -u root chf_features < nfs/chf/schema.features.doris.sql

      - name: Apply ADRF schemas (ADR-0367 -- Doris data store, PostgreSQL ML model store)
        run: |
          docker exec ${{ job.services.doris.id }} mysql -h 127.0.0.1 -P 9030 -u root -e "CREATE DATABASE IF NOT EXISTS adrf_data"
          docker exec -i ${{ job.services.doris.id }} mysql -h 127.0.0.1 -P 9030 -u root adrf_data < nfs/adrf/schema.doris.sql
          docker exec -i ${{ job.services['postgres-adrf'].id }} psql -U adrf -d adrf < nfs/adrf/schema.sql

      - name: Prepare the NWDAF training sidecar venv (ADR-0369)
        # The MTLF test trains through nfs/nwdaf/training/train_nf_load.py; the venv lives in the
        # runner's home and is rebuilt only when its imports fail (a self-hosted runner keeps it).
        run: |
          VENV="$HOME/.local/nwdaf-training-venv"
          if ! "$VENV/bin/python3" -c "import sklearn, skl2onnx, mlflow, onnx" 2>/dev/null; then
            rm -rf "$VENV"
            python3 -m venv "$VENV"
            "$VENV/bin/pip" install -q -r nfs/nwdaf/training/requirements.txt
          fi
          echo "NWDAF_TRAINING_PYTHON=$VENV/bin/python3" >> "$GITHUB_ENV"

      - name: Test
        # --timeout 120: defense in depth. A single spawned-NF-process crash/hang (real one hit
        # here: missing certs killed AMF on startup, which left ctest waiting its full default
        # timeout instead of failing fast, then every later test failed too from port contention
        # with the still-running orphaned processes) should fail in ~2 minutes, not 25.
        # TEST_POSTGRES_URL: points test_product_catalog_postgres.cpp at the real service above
        # instead of its local-dev default, so CI exercises the real DB path (ADR-0054) instead of
        # GTEST_SKIP()-ing it.
        # TSAN_OPTIONS: real, disclosed, narrowly-scoped suppression (ADR-0239, .tsan-suppressions)
        # for a known upstream OpenSSL 3.6.3 data race in its own ASN1_STRING_cmp/ASN1_STRING_set
        # internals during concurrent handshake cert-chain verification -- not this project's own
        # code. Harmless on the asan-ubsan leg (TSAN_OPTIONS is simply unused there).
        env:
          TEST_POSTGRES_URL: postgresql://postgres@localhost:15434/charging
          TEST_SUBSCRIBER_MANAGEMENT_POSTGRES_URL: postgresql://subscriber_management:subscriber_management@localhost:15435/subscriber_management
          TEST_ROAMING_INTERCONNECT_POSTGRES_URL: postgresql://roaming_interconnect:roaming_interconnect@localhost:15436/roaming_interconnect
          PRODUCT_CATALOG_DATABASE_URL: postgresql://postgres@localhost:15434/charging
          SUBSCRIBER_MANAGEMENT_DATABASE_URL: postgresql://subscriber_management:subscriber_management@localhost:15435/subscriber_management
          BALANCE_MANAGEMENT_DATABASE_URL: postgresql://balance_management:balance_management@localhost:15433/balance_management
          ROAMING_INTERCONNECT_DATABASE_URL: postgresql://roaming_interconnect:roaming_interconnect@localhost:15436/roaming_interconnect
          UDR_DATABASE_URL: postgresql://udr:udr@localhost:15437/udr
          MCP_PII_AUDIT_DATABASE_URL: postgresql://udr:udr@127.0.0.1:15437/mcp_audit
          AMF_REDIS_URL: tcp://127.0.0.1:16379
          AUSF_REDIS_URL: tcp://127.0.0.1:16379
          NWDAF_REDIS_URL: tcp://127.0.0.1:16379
          MFAF_REDIS_URL: tcp://127.0.0.1:16379
          DCCF_REDIS_URL: tcp://127.0.0.1:16379
          ADRF_REDIS_URL: tcp://127.0.0.1:16379
          LI_MDF_REDIS_URL: tcp://127.0.0.1:16379
          # ADR-0400: the UDSF suite spawns two UDSF replicas on the CI Valkey (own realm per run).
          UDSF_REDIS_URL: tcp://127.0.0.1:16379
          ADRF_DATA_STORE_HOST: 127.0.0.1
          ADRF_DATA_STORE_PORT: "19030"
          ADRF_ML_MODEL_STORE_DATABASE_URL: postgresql://adrf:adrf@localhost:15438/adrf
          # ADR-0365: the MFAF test spawns two MFAF replicas on the CI Kafka; under TSan the test skips itself.
          MFAF_EVENT_BUS_BROKERS: 127.0.0.1:19092
          NWDAF_FEATURE_STORE_HOST: 127.0.0.1
          NWDAF_FEATURE_STORE_PORT: "19030"
          CHF_RATING_DATABASE_URL: postgresql://postgres@localhost:15434/chf_rating
          CHF_REDIS_URL: tcp://127.0.0.1:16379
          # Empty on the tsan leg: librdkafka's broker threads are created with glibc's C11
          # thrd_create, invisible to TSan's pthread_create interceptor, and segfault on first
          # allocation -- the spawned CHF would die at startup. Empty brokers = bus disabled
          # (nfs/chf/src/cdr_event_producer.cpp); the event-bus test skips itself under TSan.
          # ADR-0364 CI note 3.
          # NOT `cond && '' || 'x'`: an empty string is falsy in GitHub expressions, so that form
          # yields 'x' on BOTH legs -- the TSan run of 875e750 still built a producer and the same
          # eight tests failed. The truthy value goes on the && side.
          CHF_CDR_EVENT_BUS_BROKERS: ${{ matrix.sanitizer != 'tsan' && '127.0.0.1:19092' || '' }}
          CHF_DORIS_HOST: 127.0.0.1
          CHF_DORIS_PORT: "19030"
          TSAN_OPTIONS: suppressions=${{ github.workspace }}/.tsan-suppressions
        # The -E exclusion that used to live here is GONE (task #165) -- see the build job's own
        # note. Left as a comment rather than deleted so the history of the exclusion is findable
        # (ADR-0071/ADR-0072 pre-existing hang, never root-caused, task #165 open; this workflow's
        # ctest calls simply hadn't been kept in sync with local practice until 2026-08-18;
        # ADR-0223's own third exclusion was retracted by ADR-0224 once the real root cause --
        # `nef` missing from the PKI-generation NF list -- was found and fixed; ADR-0231/task #166
        # retracted the UdmIntegration.SdmDataRetrievalAndSubscriptions exclusion once its own real
        # root cause -- a udr-startup timing race, not an unexplained hang -- was found and fixed).
        run: |
          RUN=
          if [ "${{ matrix.sanitizer }}" = "tsan" ]; then RUN="setarch $(uname -m) -R"; fi  # see the Build step
          # --timeout 300 here, not the build leg's 120: ASan/UBSan (and TSan) instrument every
          # memory access, so the same test runs 2-3x slower under a sanitizer. A multi-NF + Doris
          # integration test (NwdafPhaseC.AdrfStoresNwdafCollectedDataThroughDataManagement) that
          # passes well under 120s uninstrumented landed at 120.13s under ASan on a loaded runner
          # and was killed at the bound -- a false failure, not a hang. 300s keeps the fail-fast
          # intent (a genuinely hung NF still fails in 5 min, far short of ctest's default) while
          # giving sanitized runs the headroom they legitimately need. The build leg stays at 120.
          $RUN ctest --test-dir build --output-on-failure --timeout 300

  lint:
    runs-on: [self-hosted, linux, x64, 5gc-lab]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # ADR-0371: the changed-files lint diffs against the push's base commit

      - name: Locate caches and tools for this runner (ADR-0363)
        # Self-hosted: persistent ccache + vcpkg + binary cache outside the workspace, and a
        # parallelism the 15 GB box can carry. GitHub-hosted: the original in-workspace layout
        # and the -j2/-j1 caps (ADR-0222/0225/0229) stay exactly as they were.
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
            mkdir -p "$HOME/.cache/5gc-ci"
            echo "VCPKG_ROOT=$HOME/.cache/5gc-ci/vcpkg" >> "$GITHUB_ENV"
            echo "VCPKG_BINARY_SOURCES=clear;files,$HOME/.cache/5gc-ci/vcpkg-cache,readwrite" >> "$GITHUB_ENV"
            echo "CCACHE_DIR=$HOME/.cache/5gc-ci/ccache" >> "$GITHUB_ENV"
            echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
            # scripts/setup-asn1c.sh and libs/ngap-generated look in <repo>/build-tools; point
            # that at the persistent cache so asn1c is built once per machine, not per run.
            mkdir -p "$HOME/.cache/5gc-ci/build-tools" && rm -rf build-tools && ln -s "$HOME/.cache/5gc-ci/build-tools" build-tools
            echo "CI_JOBS=4" >> "$GITHUB_ENV"
            # vcpkg ignores CI_JOBS and builds a cache-missing port at nproc+1 (-j9 here), which
            # thrashes this 15 GB box; cap it to the same 4 the project build uses.
            echo "VCPKG_MAX_CONCURRENCY=4" >> "$GITHUB_ENV"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            echo "$HOME/.local/build-tools-venv/bin" >> "$GITHUB_PATH"
            for t in ninja cmake clang-18 clang-format-18 clang-tidy-18 bison flex ccache docker; do
              command -v "$t" >/dev/null || { echo "self-hosted runner is missing $t"; exit 1; }
            done
            ccache -o max_size=20G; ccache -z
          fi

      - name: Install clang tooling
        if: runner.environment == 'github-hosted'
        # bison/flex: see the build/sanitize jobs' "Install Ninja" step comment -- same libpq
        # (ADR-0054) build-from-source requirement applies here too, since Configure below runs
        # for the whole project including bss/product-catalog.
        run: sudo apt-get update -qq && sudo apt-get install -y clang-format-18 clang-tidy-18 ninja-build libsctp-dev libbpf-dev libcap-dev clang-18 bison flex

      - name: architecture diagram in sync with README
        run: python3 tools/diagrams/check_readme_sync.py
      - name: clang-format check
        run: |
          find libs nfs tests -name '*.hpp' -o -name '*.cpp' | xargs clang-format-18 --dry-run --Werror

      - name: Cache vcpkg binary cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-bincache-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-bincache-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: |
          # Same as the build job: clone once, check out vcpkg.json's builtin-baseline so the
          # binary cache key matches the lab machine's own vcpkg.
          BASELINE=$(python3 -c 'import json; print(json.load(open("vcpkg.json"))["builtin-baseline"])')
          if [ ! -d "$VCPKG_ROOT/.git" ]; then
            git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          fi
          if [ "$(git -C "$VCPKG_ROOT" rev-parse HEAD)" != "$BASELINE" ]; then
            git -C "$VCPKG_ROOT" fetch --quiet origin
            git -C "$VCPKG_ROOT" checkout --quiet "$BASELINE"
            rm -f "$VCPKG_ROOT/vcpkg"
          fi
          if [ ! -x "$VCPKG_ROOT/vcpkg" ]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi

      - name: Install sbi-codegen Python deps
        run: pip install -q -r tools/sbi-codegen/requirements.txt

      - name: Cache asn1c toolchain (libs/ngap-generated needs it, ADR-0030/ADR-0031)
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/build-tools/asn1c
          key: asn1c-${{ runner.os }}-${{ hashFiles('scripts/setup-asn1c.sh', 'scripts/patches/asn1c-aligned-per.patch') }}

      - name: Build asn1c toolchain (idempotent -- no-ops if the cache above already has it)
        run: ./scripts/setup-asn1c.sh

      - name: Configure (for compile_commands.json)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: clang-tidy
        # Parallelised across the runner's cores. This step was measured at 2h27m -- roughly 60% of
        # the whole workflow's wall-clock, and more than the asan-ubsan sanitizer leg -- because the
        # single `xargs clang-tidy-18` invocation analysed all 137 .cpp files (~69k lines) SERIALLY.
        # CLAUDE.md's own CI rule is to keep these jobs "fast and targeted rather than exhaustive"
        # to fit free-tier limits, which a 2.5-hour lint plainly wasn't.
        #
        # Deliberately `xargs -P` over `run-clang-tidy`: run-clang-tidy takes its file list from the
        # compilation database, which is NOT the same set as `find libs nfs -name '*.cpp'` (it also
        # carries generated sources), so switching to it would silently change WHICH files are
        # analysed. This keeps the file set byte-identical and changes only the concurrency.
        #
        # `-n 1` gives one file per process so all cores stay busy; xargs still exits non-zero if
        # any invocation fails, so warnings-as-errors continue to fail the job exactly as before.
        #
        # ADR-0371 (2026-09-16): even parallelised, the full sweep takes 4.5-5.5 h on the lab
        # runner (measured: the last two that finished), and this repo's push cadence with
        # cancel-in-progress meant every lint since 2026-09-15 02:13Z was cancelled -- eight NF
        # increments were never linted in CI. A push now lints the .cpp files it changed (the
        # diff from the push's base commit; the whole tree when there is no base, e.g. a new
        # branch); the full sweep runs weekly (schedule) and on demand (workflow_dispatch).
        env:
          BEFORE: ${{ github.event.before }}
          FULL_LINT: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_lint) }}
        run: |
          # -P capped at CI_JOBS on the self-hosted runner (ADR-0363): eight parallel clang-tidy on
          # the 15 GB lab box thrashed (0 B free, single files at 55 min) -- same lesson as the -j.
          if [ "$FULL_LINT" = "true" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "lint: full sweep (event=${GITHUB_EVENT_NAME}, before=${BEFORE:-none})"
            find libs nfs -name '*.cpp' -print0 > files.lst
          else
            git diff --name-only --diff-filter=ACMR "$BEFORE" "$GITHUB_SHA" -- 'libs/**/*.cpp' 'nfs/**/*.cpp' \
              | tr '\n' '\0' > files.lst
            echo "lint: $(tr -cd '\0' < files.lst | wc -c) file(s) changed since $BEFORE"
          fi
          if [ ! -s files.lst ]; then
            echo "lint: no .cpp changed by this push -- nothing to analyse"
            exit 0
          fi
          xargs -0 -P "${CI_JOBS:-$(nproc)}" -n 1 clang-tidy-18 -p build < files.lst
