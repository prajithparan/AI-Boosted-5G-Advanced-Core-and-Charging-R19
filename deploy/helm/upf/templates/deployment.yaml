apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-upf
  labels:
    app.kubernetes.io/name: upf
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # Single replica: PFCP sessions live in this process and in the SMF's N4 view; a second replica would
  # have no sessions the SMF knows about (same reasoning as the smf chart).
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: upf
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: upf
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: upf
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: sbi
              containerPort: {{ .Values.config.port }}
              protocol: TCP
            - name: pfcp
              containerPort: {{ .Values.config.pfcp_bind_port }}
              protocol: UDP
            - name: metrics
              containerPort: 9471
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /build/config/upf.json
              subPath: upf.json
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-upf-config
