apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-oam-gui-bff
  labels:
    app.kubernetes.io/name: oam-gui-bff
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: oam-gui-bff
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: https
      port: 8710
      targetPort: https
      protocol: TCP
    - name: metrics
      port: 9510
      targetPort: metrics
      protocol: TCP
