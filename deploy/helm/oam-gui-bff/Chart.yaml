apiVersion: v2
name: oam-gui-bff
description: >
  oam-gui-bff -- the Phase 7 operator GUI's backend-for-frontend (ADR-0420..0425, ADR-0441,
  ADR-0442): TLS 1.3 + operator-CA mTLS to the browser, OIDC (authorization code + PKCE) to a
  Keycloak realm, `operator_iam` (maker-checker, tamper-evident audit) in PostgreSQL, and a
  read/edit surface over every other component's config/<nf>.json (ADR-0425). Lab-grade Helm
  chart, same disclosed-gap category as deploy/helm/udr/Chart.yaml: no PKI provisioning (the
  operator creates a `<release>-oam-gui-bff-tls` secret for its own leaf certificate and an
  `<release>-oam-gui-bff-trust` secret for the CAs it must trust -- see values.yaml), no
  HA/clustering (single replica -- `IamStore`'s own PostgreSQL connections would work fine
  concurrently across replicas, but a second replica sharing one Deployment's baked config is
  untested here). DISCLOSED BLUNTLY, not softened: **this pod does not start as committed.** The
  image bakes in config/oam-gui-bff.json's own 127.0.0.1-based defaults (IAM database,
  product-catalog, Keycloak) exactly as amf/nrf's own charts bake in their 127.0.0.1-based NRF
  base URL (task #109's already-tracked class of gap) -- but unlike those NFs, `IamStore`'s
  constructor opens its PostgreSQL connection pool EAGERLY at startup and calls a fatal exit if it
  cannot connect (`nf_config::fatal()`, `iam.cpp`), so this pod crash-loops immediately in any real
  cluster: no chart in this repository yet provisions a reachable `operator_iam` PostgreSQL
  in-cluster (Keycloak's own chart's dedicated Postgres is a DIFFERENT database, for Keycloak
  itself). `helm lint`/`helm template` are clean (ADR-0442); `helm install` against a real cluster
  has not been attempted and would not succeed today. Closing this needs a real `operator_iam`
  Postgres Helm story (own chart, or a shared-Postgres pattern this project does not have yet) --
  real, separate follow-on work, not folded into this chart under time pressure.
type: application
version: 0.1.0
appVersion: "0.1.0"
