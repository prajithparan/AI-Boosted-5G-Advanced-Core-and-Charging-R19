image:
  repository: 5gc-oam-gui-bff
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Pre-created secrets this chart expects (NOT generated by it -- disclosed gap, same category as
# deploy/helm/keycloak's existingSecrets and every other chart's "this chart does not provision
# PKI at all"):
#   <release>-oam-gui-bff-tls      cert.pem / key.pem -- this NF's own lab-CA-signed identity
#                                   (server_cert_path/server_key_path AND client_cert_path/
#                                   client_key_path in config/oam-gui-bff.json all point at the
#                                   SAME file -- see that file's own comment for why: every NF in
#                                   this project is simultaneously an SBI server and client).
#   <release>-oam-gui-bff-trust    service-ca.crt (the shared lab CA every NF's cert chains to,
#                                   also this NF's idp_ca_path if Keycloak's cert chains to the
#                                   same CA) / operator-ca.crt (the SEPARATE operator-terminal CA,
#                                   config's operator_ca_path) -- two distinct trust anchors for
#                                   two distinct purposes, not interchangeable.
#   <release>-oam-gui-bff-oidc     client-secret -- the oam-gui confidential client's secret
#                                   (config's client_secret_file), rendered by
#                                   deploy/keycloak/render-realm.sh's compose equivalent.
existingSecrets:
  tls: ""       # defaults to "<release>-oam-gui-bff-tls"
  trust: ""     # defaults to "<release>-oam-gui-bff-trust"
  oidc: ""      # defaults to "<release>-oam-gui-bff-oidc"

# No autoscaling block, unlike deploy/helm/udr's: UDR earned one because its state is entirely in
# PostgreSQL (a second replica serves exactly what the first would, see udr's hpa.yaml comment).
# Nothing here has tested whether two oam-gui-bff pods behind one Service is safe (session cookie
# affinity, single-use login-state rows in IamStore) -- left out rather than claimed working.
