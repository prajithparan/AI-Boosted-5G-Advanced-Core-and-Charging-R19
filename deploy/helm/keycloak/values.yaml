image:
  repository: quay.io/keycloak/keycloak
  tag: "26.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# Realm hostname/issuer the imported realm.json and every ID token this Keycloak issues will use.
# Must match config/oam-gui-bff.json's oidc.issuer for the operator_iam rows the BFF looks up by
# (issuer, sub) to resolve (ADR-0441).
hostname: "https://127.0.0.1:8443"

# Pre-created secrets this chart expects (NOT generated by it -- disclosed gap, matches
# deploy/helm/udr's "this chart does not provision PKI at all"):
#   <release>-keycloak-tls           tls.crt / tls.key -- Keycloak's HTTPS certificate, trusted by
#                                     the same CA oam-gui-bff's idp_ca_path points at.
#   <release>-keycloak-admin         KC_BOOTSTRAP_ADMIN_USERNAME / KC_BOOTSTRAP_ADMIN_PASSWORD --
#                                     the MASTER realm admin console only, unrelated to operator
#                                     GUI login.
#   <release>-keycloak-db            POSTGRES_PASSWORD for this chart's own dedicated PostgreSQL.
#   <release>-keycloak-realm-import  realm.json (optional) -- render with
#                                     deploy/keycloak/render-realm.sh.
existingSecrets:
  tls: ""            # defaults to "<release>-keycloak-tls"
  admin: ""           # defaults to "<release>-keycloak-admin"
  db: ""               # defaults to "<release>-keycloak-db"
  realmImport: ""      # defaults to "<release>-keycloak-realm-import"; unset entirely to skip import

postgres:
  image: postgres:16
  storage: 4Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
