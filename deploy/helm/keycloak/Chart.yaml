apiVersion: v2
name: keycloak
description: >
  Keycloak (Apache-2.0, self-hosted) -- the real OIDC identity provider for the operator GUI
  (ADR-0424, ADR-0441): authorization-code + PKCE, TOTP MFA gating a real `acr` claim via
  Keycloak's step-up (Level-of-Authentication) mechanism. Lab-grade Helm chart, same disclosed-gap
  category as deploy/helm/udr/Chart.yaml: no PKI provisioning (the operator creates a
  `<release>-keycloak-tls` TLS secret out of band -- see deploy/keycloak/render-realm.sh's compose
  equivalent for what that cert must satisfy), no HA/clustering (single replica, both for Keycloak
  and its own dedicated PostgreSQL -- unlike the compose deployment, which reuses the shared
  postgres-chf instance's `keycloak` database, ADR-0441; there is no equivalent shared PostgreSQL
  release in this project's Helm charts yet, so this chart brings its own rather than assume one).
  The realm (client, step-up MFA flow, operator users) is supplied as a
  `<release>-keycloak-realm-import` Secret containing `realm.json` -- render one with
  deploy/keycloak/render-realm.sh and `kubectl create secret generic ... --from-file=realm.json=...`;
  omit it to start with an empty realm store instead.
type: application
version: 0.1.0
appVersion: "26.0"
