      LI-ADMF_CONFIG_FILE: /build/deploy/docker/li-admf.compose.json
      LI_ADMF_DATABASE_URL: postgresql://li_admf:li_admf@postgres-li:5432/li_admf
    volumes:
      - certs_data:/build/certs
      # ADR-0453: every NF service gets this -- see this file's own header note (top of
      # file) for why. Bind mount, not a Dockerfile COPY, so editing config/<nf>.json on the
      # host takes effect on container restart without an image rebuild.
      - ../../config:/build/config:ro
      - ./li-admf.compose.json:/build/deploy/docker/li-admf.compose.json:ro
    ports:
      - "7808:7808"   # LI_HI1 from the LEA + LI_X1 reports from the NEs (TLS 1.3 + mTLS)
      - "9492:9492"   # Prometheus /metrics

  # ADR-0462: the ADMF's warrant store -- its own PostgreSQL, a separate security domain from every
  # NF/BSS datastore (TS 33.127 5.6), because warrants and legal documents are durable records.
  postgres-li:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: li_admf
      POSTGRES_PASSWORD: li_admf
      POSTGRES_DB: li_admf
    volumes:
      - postgres_li_data:/var/lib/postgresql/data
      - ../../nfs/li-admf/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U li_admf"]
      interval: 5s
      timeout: 5s
      retries: 10

  adrf:
    build:
      context: ../..
      dockerfile: deploy/docker/adrf.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
      dccf:
        condition: service_started
      doris-schema-init:
        condition: service_completed_successfully
      postgres-adrf:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      ADRF_REDIS_URL: tcp://valkey:6379
      ADRF_ADVERTISED_IPV4: adrf
      ADRF_SELF_BASE_URL: https://adrf:7804
      ADRF_DCCF_BASE_URL: https://dccf:7803
      ADRF_NWDAF_BASE_URL: https://nwdaf:7798
      ADRF_DATA_STORE_HOST: doris
      ADRF_ML_MODEL_STORE_DATABASE_URL: postgresql://adrf:adrf@postgres-adrf:5432/adrf
    volumes:
      - certs_data:/build/certs
      # ADR-0453: every NF service gets this -- see this file's own header note (top of
      # file) for why. Bind mount, not a Dockerfile COPY, so editing config/<nf>.json on the
      # host takes effect on container restart without an image rebuild.
      - ../../config:/build/config:ro
    ports:
      - "7804:7804"   # Nadrf_DataManagement + Nadrf_MLModelManagement (TLS 1.3 + mTLS)
      - "9490:9490"   # Prometheus /metrics

  smsf:
