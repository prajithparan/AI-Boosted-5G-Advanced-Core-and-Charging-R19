# Lab bring-up for the NFs built so far. Run from the repo root:
#   docker compose -f deploy/docker/docker-compose.yml up --build
#
# PKI is provisioned ONCE by pki-init into the shared certs_data volume, which every NF container
# mounts read-write at /build/certs. This replaced an earlier design where each NF generated its
# own lab PKI independently at container start (fine with only one NF/container in the compose
# file, which is all that existed then) -- discovered broken while adding amf as a second
# container: two independently-generated CAs would not trust each other's leaf certs, so the mTLS
# handshake between nrf and amf would fail. See docs/DECISIONS.md ADR-0019.

services:
  pki-init:
    image: ubuntu:24.04
    working_dir: /build
    volumes:
      - certs_data:/build/certs
      - ../../scripts:/build/scripts:ro
    entrypoint:
      - /bin/bash
      - -c
      - "apt-get update >/dev/null && apt-get install -y --no-install-recommends openssl >/dev/null && ./scripts/gen-lab-pki.sh nrf amf smf udm udr ausf pcf nssf bsf nef scp eir nsacf smsf gmlc lmf product-catalog balance-management chf subscriber-management roaming-interconnect nwdaf mfaf dccf adrf li-mdf li-mdf3 li-admf udsf keycloak oam-gui-bff upf"

  nrf:
    build:
      context: ../..
      dockerfile: deploy/docker/nrf.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
    volumes:
      - certs_data:/build/certs
      # ADR-0453: nrf.Dockerfile's runtime stage never copied config/nrf.json (confirmed: neither
      # does any other NF's Dockerfile except amf/li-mdf/oam-gui-bff) -- a fresh container start
      # crashes immediately with nf_config's own "could not open config file" fatal error. A bind
      # mount (not a Dockerfile COPY) so editing config/nrf.json on the host takes effect on the
      # next container restart without an image rebuild, matching certs_data's own
      # runtime-mounted-not-baked-in shape above.
      - ../../config:/build/config:ro
    ports:
      - "7777:7777"   # Nnrf_NFManagement / Nnrf_NFDiscovery / Nnrf_AccessToken (TLS 1.3 + mTLS)
      - "9464:9464"   # Prometheus /metrics

  amf:
    build:
      context: ../..
      dockerfile: deploy/docker/amf.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
      valkey:
        condition: service_healthy
    # docs/DECISIONS.md ADR-0077: config/amf.json's own defaults (127.0.0.1) are for direct
    # binary/lab runs; these two env vars override per-key for compose's own bridge-network
    # DNS names, same pattern CHF's own CHF_REDIS_URL already used below. Real, pre-existing
    # latent bug found while wiring this (not introduced by this change, and not fixed for the
    # other already-composed NFs yet -- see task #109): every other NF's own hardcoded
    # "127.0.0.1:7777" NRF base URL would not actually resolve across separate compose
    # containers either, since compose's default bridge network gives each container its own
    # loopback.
    environment:
      AMF_NRF_BASE_URL: https://nrf:7777
      AMF_REDIS_URL: tcp://valkey:6379
    volumes:
      - certs_data:/build/certs
      # ADR-0453: every NF service gets this -- see this file's own header note (top of
      # file) for why. Bind mount, not a Dockerfile COPY, so editing config/<nf>.json on the
      # host takes effect on container restart without an image rebuild.
      - ../../config:/build/config:ro
    ports:
      - "7778:7778"   # Namf_Communication (TLS 1.3 + mTLS)
      - "9465:9465"   # Prometheus /metrics
      - "7807:7807"   # LI_X1 provisioning for the AMF IRI-POI (ADR-0377; bound only when li_poi.enabled)

  smf:
    build:
      context: ../..
      dockerfile: deploy/docker/smf.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
    volumes:
      - certs_data:/build/certs
      # ADR-0453: every NF service gets this -- see this file's own header note (top of
      # file) for why. Bind mount, not a Dockerfile COPY, so editing config/<nf>.json on the
      # host takes effect on container restart without an image rebuild.
      - ../../config:/build/config:ro
    ports:
      - "7779:7779"   # Nsmf_PDUSession /sm-contexts (TLS 1.3 + mTLS)
      - "9466:9466"   # Prometheus /metrics

  # ADR-0466: UPF -- PFCP (N4) + the lab eBPF/XDP GTP-U datapath. The datapath needs capabilities a
  # container does not have by default (ip link/netns need NET_ADMIN + SYS_ADMIN, the netns bind-mount
  # target needs DAC_OVERRIDE, loading XDP needs BPF + PERFMON); without them the UPF still starts and
  # serves PFCP, and logs that the datapath was not started. config/upf.json `advertised_ipv4: auto`
  # makes it register the address it uses to reach the NRF (this container's own), which is what the SMF
  # sends PFCP to. First container run 2026-10-09: see ADR-0466 (libli_core, pki-init cert, datapath caps).
  upf:
    build:
      context: ../..
      dockerfile: deploy/docker/upf.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
    environment:
      UPF_NRF_BASE_URL: https://nrf:7777
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - DAC_OVERRIDE
      - BPF
      - PERFMON
    volumes:
      - certs_data:/build/certs
      # ADR-0453 (mandatory, DoD item 7): config/upf.json is not in the image.
      - ../../config:/build/config:ro
    ports:
      - "7796:7796"       # Nupf SBI (TLS 1.3 + mTLS)
      - "8805:8805/udp"   # PFCP N4
      - "9471:9471"       # Prometheus /metrics

  udm:
    build:
      context: ../..
      dockerfile: deploy/docker/udm.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
      # ADR-0069 (gap-closure Tier 1b): GetAmData/GetSmfSelData/GetSmData now make real
      # Nudr_DataRepository calls -- same "depends_on the NF it real-calls" pattern ausf's own
      # dependency on udm already established.
      udr:
        condition: service_started
    volumes:
      - certs_data:/build/certs
      # ADR-0453: every NF service gets this -- see this file's own header note (top of
      # file) for why. Bind mount, not a Dockerfile COPY, so editing config/<nf>.json on the
      # host takes effect on container restart without an image rebuild.
      - ../../config:/build/config:ro
    ports:
      - "7780:7780"   # Nudm_UECM / Nudm_SDM (TLS 1.3 + mTLS)
      - "9467:9467"   # Prometheus /metrics

  # Real PostgreSQL for UDR's context-data persistence (ADR-0068, gap-closure Tier 1a) -- own
  # dedicated instance, same "one postgres per consumer" shape as every other PostgreSQL-backed
  # service in this compose file.
  postgres-udr:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: udr
      POSTGRES_PASSWORD: udr
      POSTGRES_DB: udr
    volumes:
      - postgres_udr_data:/var/lib/postgresql/data
      - ../../nfs/udr/schema.postgres.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U udr"]
      interval: 5s
      timeout: 5s
      retries: 10

  udr:
    build:
      context: ../..
      dockerfile: deploy/docker/udr.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
      postgres-udr:
        condition: service_healthy
    environment:
      UDR_DATABASE_URL: postgresql://udr:udr@postgres-udr:5432/udr
      # ADR-0077 retrofit: same real cross-container bug AMF's own AMF_NRF_BASE_URL already fixed
      # (127.0.0.1 inside this container is udr's own loopback, not nrf's).
      UDR_NRF_BASE_URL: https://nrf:7777
    volumes:
      - certs_data:/build/certs
      # ADR-0453: every NF service gets this -- see this file's own header note (top of
      # file) for why. Bind mount, not a Dockerfile COPY, so editing config/<nf>.json on the
      # host takes effect on container restart without an image rebuild.
      - ../../config:/build/config:ro
    ports:
      - "7781:7781"   # Nudr_DataRepository context-data group (TLS 1.3 + mTLS)
      - "9468:9468"   # Prometheus /metrics

  ausf:
    build:
      context: ../..
      dockerfile: deploy/docker/ausf.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
      udm:
        condition: service_started
    volumes:
      - certs_data:/build/certs
      # ADR-0453: every NF service gets this -- see this file's own header note (top of
      # file) for why. Bind mount, not a Dockerfile COPY, so editing config/<nf>.json on the
      # host takes effect on container restart without an image rebuild.
      - ../../config:/build/config:ro
    ports:
      - "7782:7782"   # Nausf_UEAuthentication ue-authentications group (TLS 1.3 + mTLS)
      - "9469:9469"   # Prometheus /metrics

  pcf:
    build:
      context: ../..
      dockerfile: deploy/docker/pcf.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
    volumes:
      - certs_data:/build/certs
      # ADR-0453: every NF service gets this -- see this file's own header note (top of
      # file) for why. Bind mount, not a Dockerfile COPY, so editing config/<nf>.json on the
      # host takes effect on container restart without an image rebuild.
      - ../../config:/build/config:ro
    ports:
      - "7783:7783"   # Npcf_AMPolicyControl / Npcf_SMPolicyControl (TLS 1.3 + mTLS)
      - "9470:9470"   # Prometheus /metrics

  nssf:
    build:
      context: ../..
      dockerfile: deploy/docker/nssf.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
    volumes:
      - certs_data:/build/certs
      # ADR-0453: every NF service gets this -- see this file's own header note (top of
      # file) for why. Bind mount, not a Dockerfile COPY, so editing config/<nf>.json on the
      # host takes effect on container restart without an image rebuild.
      - ../../config:/build/config:ro
    ports:
      - "7801:7801"   # Nnssf_NSSelection / Nnssf_NSSAIAvailability (TLS 1.3 + mTLS)
      - "9486:9486"   # Prometheus /metrics

  bsf:
    build:
      context: ../..
      dockerfile: deploy/docker/bsf.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
    volumes:
      - certs_data:/build/certs
      # ADR-0453: every NF service gets this -- see this file's own header note (top of
      # file) for why. Bind mount, not a Dockerfile COPY, so editing config/<nf>.json on the
      # host takes effect on container restart without an image rebuild.
      - ../../config:/build/config:ro
    ports:
      - "7789:7789"   # Nbsf_Management (TLS 1.3 + mTLS)
      - "9477:9477"   # Prometheus /metrics

  nef:
    build:
      context: ../..
      dockerfile: deploy/docker/nef.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
    volumes:
      - certs_data:/build/certs
      # ADR-0453: every NF service gets this -- see this file's own header note (top of
      # file) for why. Bind mount, not a Dockerfile COPY, so editing config/<nf>.json on the
      # host takes effect on container restart without an image rebuild.
      - ../../config:/build/config:ro
    ports:
      - "7790:7790"   # Nnef_PFDmanagement (TLS 1.3 + mTLS)
      - "9478:9478"   # Prometheus /metrics

  scp:
    build:
      context: ../..
      dockerfile: deploy/docker/scp.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
    volumes:
      - certs_data:/build/certs
      # ADR-0453: every NF service gets this -- see this file's own header note (top of
      # file) for why. Bind mount, not a Dockerfile COPY, so editing config/<nf>.json on the
      # host takes effect on container restart without an image rebuild.
      - ../../config:/build/config:ro
    ports:
      - "7791:7791"   # Nscp_EventExposure (TLS 1.3 + mTLS)
      - "9479:9479"   # Prometheus /metrics

  eir:
    build:
      context: ../..
      dockerfile: deploy/docker/eir.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
    volumes:
      - certs_data:/build/certs
      # ADR-0453: every NF service gets this -- see this file's own header note (top of
      # file) for why. Bind mount, not a Dockerfile COPY, so editing config/<nf>.json on the
      # host takes effect on container restart without an image rebuild.
      - ../../config:/build/config:ro
    ports:
      - "7792:7792"   # N5g-eir_EquipmentIdentityCheck (TLS 1.3 + mTLS)
      - "9480:9480"   # Prometheus /metrics

  nsacf:
    build:
      context: ../..
      dockerfile: deploy/docker/nsacf.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
    volumes:
      - certs_data:/build/certs
      # ADR-0453: every NF service gets this -- see this file's own header note (top of
      # file) for why. Bind mount, not a Dockerfile COPY, so editing config/<nf>.json on the
      # host takes effect on container restart without an image rebuild.
      - ../../config:/build/config:ro
    ports:
      - "7797:7797"   # Nnsacf_NSAC + Nnsacf_SliceEventExposure (TLS 1.3 + mTLS)
      - "9484:9484"   # Prometheus /metrics

  # ADR-0358/0368/0369: the NWDAF containing AnLF -- Nnwdaf_AnalyticsInfo, EventsSubscription,
  # DataManagement; collects via the DCCF; takes its NF_LOAD model from nwdaf-mtlf below and
  # infers in-process (ONNX Runtime). One binary, `NWDAF_ROLE` selects the logical function.
  nwdaf:
    build:
      context: ../..
      dockerfile: deploy/docker/nwdaf.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
      doris:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      NWDAF_ROLE: anlf
      NWDAF_FEATURE_STORE_HOST: doris
      NWDAF_REDIS_URL: tcp://valkey:6379   # ADR-0360: subscription state shared across replicas
      NWDAF_SELF_BASE_URL: https://nwdaf:7798   # ADR-0368: where the DCCF's deliveries land
      NWDAF_DCCF_BASE_URL: https://dccf:7803
      NWDAF_MTLF_BASE_URL: https://nwdaf-mtlf:7797   # ADR-0369: Nnwdaf_MLModelProvision
      NWDAF_ADRF_BASE_URL: https://adrf:7804         # ADR-0369: model retrieval
    volumes:
      - certs_data:/build/certs
      # ADR-0453: every NF service gets this -- see this file's own header note (top of
      # file) for why. Bind mount, not a Dockerfile COPY, so editing config/<nf>.json on the
      # host takes effect on container restart without an image rebuild.
      - ../../config:/build/config:ro
    ports:
      - "7798:7798"   # Nnwdaf_AnalyticsInfo + EventsSubscription + DataManagement (TLS 1.3 + mTLS)
      - "9485:9485"   # Prometheus /metrics

  # ADR-0369: the NWDAF containing MTLF -- Nnwdaf_MLModelProvision. Trains the NF_LOAD model
  # through the Python sidecar baked into the same image (/opt/nwdaf-training, its own venv),
  # on the data the ADRF stores from the AnLF, stores every model through Nadrf_MLModelManagement
  # and tracks every run in MLflow (SQLite on the volume below; point
  # NWDAF_TRAINING_MLFLOW_TRACKING_URI at a self-hosted MLflow server to share lineage).
  nwdaf-mtlf:
    build:
      context: ../..
      dockerfile: deploy/docker/nwdaf.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
      adrf:
        condition: service_started
      valkey:
        condition: service_healthy
    environment:
      NWDAF_ROLE: mtlf
      NWDAF_PORT: "7797"
      NWDAF_METRICS_BIND_ADDRESS: 0.0.0.0:9486
      NWDAF_FEATURE_STORE_HOST: doris
      NWDAF_REDIS_URL: tcp://valkey:6379
      NWDAF_SELF_BASE_URL: https://nwdaf-mtlf:7797
      NWDAF_DCCF_BASE_URL: https://dccf:7803
      NWDAF_ADRF_BASE_URL: https://adrf:7804
      NWDAF_TRAINING_PYTHON: /opt/nwdaf-training/.venv/bin/python3
      NWDAF_TRAINING_SCRIPT: /opt/nwdaf-training/train_nf_load.py
      NWDAF_TRAINING_WORKDIR: /var/lib/nwdaf/training
      NWDAF_TRAINING_MLFLOW_TRACKING_URI: sqlite:////var/lib/nwdaf/training/mlflow.db
    volumes:
      - certs_data:/build/certs
      # ADR-0453: every NF service gets this -- see this file's own header note (top of
      # file) for why. Bind mount, not a Dockerfile COPY, so editing config/<nf>.json on the
      # host takes effect on container restart without an image rebuild.
      - ../../config:/build/config:ro
      - nwdaf_training_data:/var/lib/nwdaf/training
    ports:
      - "7797:7797"   # Nnwdaf_MLModelProvision (TLS 1.3 + mTLS)
      - "9486:9486"   # Prometheus /metrics

  # MDF2 -- Mediation and Delivery Function for IRI (ADR-0377). Deliberately has no NRF
  # dependency: TS 33.127 keeps the LI architecture off the service-based plane, so this NF
  # registers with nothing and is discoverable only to the ADMF that provisions it over X1.
  li-mdf:
    build:
      context: ../..
      dockerfile: deploy/docker/li-mdf.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    environment:
      LI_MDF_REDIS_URL: tcp://valkey:6379
    volumes:
      - certs_data:/build/certs
      # ADR-0453: every NF service gets this -- see this file's own header note (top of
      # file) for why. Bind mount, not a Dockerfile COPY, so editing config/<nf>.json on the
      # host takes effect on container restart without an image rebuild.
      - ../../config:/build/config:ro
    ports:
      - "7805:7805"   # LI_X1 provisioning from the ADMF (TLS 1.3 + mTLS)
      - "7806:7806"   # LI_X2 from the IRI-POIs (TLS 1.3 + mTLS)
      - "9491:9491"   # Prometheus /metrics

  # ADR-0464: MDF3 -- the content-of-communication counterpart of li-mdf (LI_X3 in, LI_HI3 out).
  li-mdf3:
    build:
      context: ../..
      dockerfile: deploy/docker/li-mdf3.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    environment:
      LI_MDF3_REDIS_URL: tcp://valkey:6379
    volumes:
      - certs_data:/build/certs
      # ADR-0453: every NF service gets this -- see this file's own header note (top of
      # file) for why. Bind mount, not a Dockerfile COPY, so editing config/<nf>.json on the
      # host takes effect on container restart without an image rebuild.
      - ../../config:/build/config:ro
    ports:
      - "7811:7811"   # LI_X1 provisioning from the ADMF (TLS 1.3 + mTLS)
      - "7812:7812"   # LI_X3 from the UPF CC-POI (TLS 1.3 + mTLS)
      - "9493:9493"   # Prometheus /metrics

  # ADR-0365: MFAF -- the TS 23.288 Messaging Framework Adaptor over Kafka; state in Valkey.
  # Replicate with `docker compose up --scale mfaf=N`: replicas share Valkey and join one Kafka
  # consumer group, so every configuration is visible everywhere and each notification is
  # delivered once.
  mfaf:
    build:
      context: ../..
      dockerfile: deploy/docker/mfaf.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    environment:
      MFAF_REDIS_URL: tcp://valkey:6379
      # ADR-0443: the 3-broker cluster's own INTERNAL listener (not kafka:9092's HOST listener --
      # that was reachable from another container only by accident, since its advertised address
      # was 127.0.0.1, meaningless inside a container; the real bug is disclosed there).
      MFAF_EVENT_BUS_BROKERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      MFAF_ADVERTISED_IPV4: mfaf
    volumes:
      - certs_data:/build/certs
      # ADR-0453: every NF service gets this -- see this file's own header note (top of
      # file) for why. Bind mount, not a Dockerfile COPY, so editing config/<nf>.json on the
      # host takes effect on container restart without an image rebuild.
      - ../../config:/build/config:ro
    ports:
      - "7800:7800"   # Nmfaf_3daDataManagement + ContextManagement + inbound/fetch (TLS 1.3 + mTLS)
      - "9487:9487"   # Prometheus /metrics

  # ADR-0400: UDSF -- Nudsf_DataRepository + Nudsf_Timer (TS 29.598); all state in Valkey, so
  # replicas are stateless (--scale udsf=N; expiries are claimed so each fires once).
  #
  # ADR-0451: points at the real Valkey Cluster (valkey-cluster-1..6 above), not the single-node
  # `valkey` every other NF still uses -- UDSF's RedisRouter (sw::redis::RedisCluster) is the one
  # store in this codebase that actually handles MOVED/ASK redirects, so it's the one NF this
  # cutover is safe for. `depends_on: valkey-cluster-init` (not just one node healthy): the cluster
  # isn't actually FORMED -- no slots assigned -- until that one-shot `--cluster create` completes;
  # starting UDSF against an unformed cluster would have every key operation fail with CLUSTERDOWN.
  udsf:
    build:
      context: ../..
      dockerfile: deploy/docker/udsf.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
      valkey-cluster-init:
        condition: service_completed_successfully
    environment:
      UDSF_REDIS_URL: tcp://valkey-cluster-1:6379
      UDSF_REDIS_MODE: cluster
      UDSF_NRF_BASE_URL: https://nrf:7777
      UDSF_ADVERTISED_IPV4: udsf
    volumes:
      - certs_data:/build/certs
      # ADR-0453: same real, pre-existing gap as nrf's own volumes block above -- udsf.Dockerfile
      # never copied config/udsf.json either, so a fresh container crashed immediately on this
      # exact "could not open config file" error, found while finally running ADR-0451's live
      # functional check.
      - ../../config:/build/config:ro
    ports:
      - "7830:7830"   # Nudsf_DataRepository + Nudsf_Timer (TLS 1.3 + mTLS)
      - "9530:9530"   # Prometheus /metrics

  # ADR-0366: DCCF -- data collection coordination; one source subscription per data spec,
  # fanned out through the MFAF; state in Valkey (stateless replicas, --scale dccf=N).
  dccf:
    build:
      context: ../..
      dockerfile: deploy/docker/dccf.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
      mfaf:
        condition: service_started
      valkey:
        condition: service_healthy
    environment:
      DCCF_REDIS_URL: tcp://valkey:6379
      DCCF_ADVERTISED_IPV4: dccf
      DCCF_MFAF_BASE_URL: https://mfaf:7800
      DCCF_AMF_BASE_URL: https://amf:7778
      DCCF_NSACF_BASE_URL: https://nsacf:7797
      DCCF_NWDAF_BASE_URL: https://nwdaf:7798
    volumes:
      - certs_data:/build/certs
      # ADR-0453: every NF service gets this -- see this file's own header note (top of
      # file) for why. Bind mount, not a Dockerfile COPY, so editing config/<nf>.json on the
      # host takes effect on container restart without an image rebuild.
      - ../../config:/build/config:ro
    ports:
      - "7803:7803"   # Ndccf_DataManagement + Ndccf_ContextManagement (TLS 1.3 + mTLS)
      - "9489:9489"   # Prometheus /metrics

  # ADR-0367: the ADRF's ML model store -- its own PostgreSQL (one datastore per NF, as UDR,
  # CHF, the BSS services each have theirs); model bytes live here so every ADRF replica serves
  # every model. Data/analytics records go to Doris (adrf_data, doris-schema-init above).
  postgres-adrf:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adrf
      POSTGRES_PASSWORD: adrf
      POSTGRES_DB: adrf
    volumes:
