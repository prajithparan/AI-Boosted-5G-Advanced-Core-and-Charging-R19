      - ../../config:/build/config:ro
    ports:
      - "7795:7795"   # Nlmf_Location (TLS 1.3 + mTLS)
      - "9483:9483"   # Prometheus /metrics

  product-catalog:
    build:
      context: ../..
      dockerfile: deploy/docker/product-catalog.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      postgres-chf:
        condition: service_healthy
    environment:
      # ADR-0384: the consolidated charging DB, schema product_catalog (normalized TMF620 model).
      PRODUCT_CATALOG_DATABASE_URL: postgresql://postgres@postgres-chf:5432/charging
    volumes:
      - certs_data:/build/certs
      # ADR-0453: every NF service gets this -- see this file's own header note (top of
      # file) for why. Bind mount, not a Dockerfile COPY, so editing config/<nf>.json on the
      # host takes effect on container restart without an image rebuild.
      - ../../config:/build/config:ro
    ports:
      - "7785:7785"   # TMF620 Product Catalog Management (TLS 1.3 + mTLS)
      - "9473:9473"   # Prometheus /metrics

  balance-management:
    build:
      context: ../..
      dockerfile: deploy/docker/balance-management.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      postgres-chf:
        condition: service_healthy
    environment:
      # ADR-0385: the consolidated charging DB, schema balance_mgmt.
      BALANCE_MANAGEMENT_DATABASE_URL: postgresql://postgres@postgres-chf:5432/charging
      # ADR-0077 retrofit: self_base_url is embedded in this service's own response payloads
      # (resource href/id) -- 127.0.0.1 inside this container is not reachable from any other
      # container, same class of bug as the *_NRF_BASE_URL fixes elsewhere in this file.
      BALANCE_MANAGEMENT_SELF_BASE_URL: https://balance-management:7786
    volumes:
      - certs_data:/build/certs
      # ADR-0453: every NF service gets this -- see this file's own header note (top of
      # file) for why. Bind mount, not a Dockerfile COPY, so editing config/<nf>.json on the
      # host takes effect on container restart without an image rebuild.
      - ../../config:/build/config:ro
    ports:
      - "7786:7786"   # TMF654 Prepay Balance Management (TLS 1.3 + mTLS)
      - "9474:9474"   # Prometheus /metrics

  # Real PostgreSQL hosting the consolidated `charging` + `orchestration` + `operator_iam` domain
  # DBs (ADR-0384/0423) -- POSTGRES_HOST_AUTH_METHOD=trust matches CHF's own real default conninfo
  # (postgresql://postgres@.../charging, no password -- a real, disclosed lab-only credential
  # shape). Custom image (ADR-0392): postgres:16 + the real PGDG `postgresql-16-partman` package,
  # for automatic partition maintenance on the charging DB's Tier-1-scale event tables.
  postgres-chf:
    build:
      context: ../..
      dockerfile: deploy/docker/postgres-chf.Dockerfile
    # shared_preload_libraries can only be set at server start, not via ALTER SYSTEM + reload, so
    # the BGW's own scheduling (ADR-0392) is enabled here rather than left to a manual maintenance
    # call. pg_partman_bgw.dbname names every database this instance's part_config rows live in.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_partman_bgw
      - -c
      - pg_partman_bgw.interval=3600
      - -c
      - pg_partman_bgw.role=postgres
      - -c
      - pg_partman_bgw.dbname=charging
      - -c
      - pg_partman_bgw.analyze=false
      - -c
      - pg_partman_bgw.jobmon=false
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      # ADR-0390/0392: no POSTGRES_DB -- the per-service `chf_rating` database this used to
      # auto-create at first start is unused since ADR-0388 moved it to a SCHEMA inside `charging`.
    volumes:
      - postgres_chf_data:/var/lib/postgresql/data
      # ADR-0384: the consolidated domain DBs (charging, orchestration) on this same instance.
      - ../db:/domain-ddl:ro
      - ../db/init-domain-dbs.sh:/docker-entrypoint-initdb.d/20-domain-dbs.sh:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Keycloak (Apache-2.0, self-hosted) -- the real OIDC IdP for the operator GUI (ADR-0424,
  # ADR-0441): authorization-code + PKCE, real ES256/RS256-signed ID tokens, real JWKS, real TOTP
  # MFA gating a real `acr` claim via Keycloak's step-up (Level-of-Authentication) mechanism.
  # Its own database is a SEPARATE database ("keycloak") on this SAME postgres-chf instance --
  # not a schema inside `operator_iam`, not a dedicated postgres container. Keycloak owns and
  # migrates that database itself (Liquibase, at boot); init-domain-dbs.sh only CREATEs it empty.
  # See docs/DECISIONS.md ADR-0441 for the alternatives this rejected (dedicated postgres
  # instance; reusing operator_iam's database/schema).
  #
  # The realm (client, step-up MFA flow, two lab operator users) is provisioned by
  # deploy/keycloak/render-realm.sh into deploy/keycloak/import/ (gitignored, generated secrets --
  # same pattern as certs/) BEFORE `docker compose up keycloak`; Keycloak's `--import-realm` reads
  # it once, on first boot against an empty `keycloak` database.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    depends_on:
      pki-init:
        condition: service_completed_successfully
      postgres-chf:
        condition: service_healthy
    environment:
      # Lab-only bootstrap credential for the MASTER realm admin console, same disclosed shape as
      # postgres-chf's POSTGRES_HOST_AUTH_METHOD=trust above -- not used by the operator GUI login
      # path at all (that is the imported 5gc-r19-operators realm, OIDC-only, no admin console).
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: lab-only-change-me
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-chf:5432/keycloak
      KC_DB_USERNAME: postgres
      # Ignored by postgres-chf's trust auth; the Postgres JDBC driver still requires a non-empty
      # value to be configured.
      KC_DB_PASSWORD: unused-trust-auth
      KC_HOSTNAME: https://127.0.0.1:8443
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - certs_data:/build/certs:ro
      - ../keycloak/import:/opt/keycloak/data/import:ro
    command:
      - start
      - --import-realm
      - --https-certificate-file=/build/certs/keycloak/cert.pem
      - --https-certificate-key-file=/build/certs/keycloak/key.pem
    ports:
      - "8443:8443"   # 5gc-r19-operators realm OIDC endpoints (TLS 1.3, lab CA)
    # No healthcheck: the Keycloak image ships no shell/curl/wget to probe its own health endpoint
    # with. oam-gui-bff below depends_on keycloak only at service_started (not a health condition
    # this image cannot report) -- ADR-0442's own OidcAuthenticator does not fetch JWKS at
    # construction (main.cpp constructs it with only the config, no eager network call), so
    # oam-gui-bff itself will not crash-loop racing Keycloak's own boot; a login attempted before
    # Keycloak is ready to serve its token/JWKS endpoints simply fails that one request.

  # ADR-0442: the operator GUI's backend-for-frontend, containerized -- closes ADR-0441's
  # COMPOSE-side deferral ("oam-gui-bff itself has no Dockerfile or compose/Helm entry"; the Helm
  # half is a separate, still-open gap -- deploy/helm/oam-gui-bff/Chart.yaml discloses it, do not
  # read this compose entry as closing that side too). Shares the lab CA every other NF does
  # (pki-init's NF list above now includes oam-gui-bff) for its own leaf certificate AND for
  # trusting keycloak's TLS server certificate (both signed by the same CA -- see
  # oam-gui-bff.Dockerfile's header comment). Its own OIDC-facing OPERATOR mTLS trust anchor
  # (`operator_ca_path`) and IdP client secret (`client_secret_file`) are a SEPARATE PKI this
  # compose file does not provision (same disclosed gap category as keycloak's own realm import
  # above): `gui/scripts/gen-operator-pki.sh terminal-lab-1` + `deploy/keycloak/render-realm.sh`,
  # run on the HOST exactly as ADR-0441 already documented, then bind-mounted in below by the two
  # specific files they produce -- NOT the whole certs_data volume, which stays container-CA-only
  # for every NF-to-NF mTLS leg. IMPORTANT, easy to get backwards: `gen-operator-pki.sh`'s own
  # final message names `certs/ca/ca.crt` (the HOST's lab CA, from a host run of
  # `scripts/gen-lab-pki.sh`) as the browser's trust anchor for this server's certificate -- true
  # for a HOST-BINARY oam-gui-bff, but this CONTAINERIZED one presents a certificate signed by the
  # certs_data VOLUME's CA instead (a separate CA; see ADR-0442's own proof for the
  # `docker run --entrypoint cat ... /build/certs/ca/ca.crt` extraction it actually trusts against).
  # An operator's browser must import THAT CA, not the host one, to reach this container without a
  # certificate warning.
  oam-gui-bff:
    build:
      context: ../..
      dockerfile: deploy/docker/oam-gui-bff.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      postgres-chf:
        condition: service_healthy
      keycloak:
        condition: service_started
      product-catalog:
        condition: service_started
    environment:
      # Selects deploy/docker/oam-gui-bff.compose.json wholesale (ADR-0442) instead of
      # config/oam-gui-bff.json's own host-binary defaults (nf_config::load's own
      # <SERVICE>_CONFIG_FILE convention, uppercased with hyphens intact -- verified against
      # nf_config.hpp's actual toupper()-only loop, not assumed).
      OAM-GUI-BFF_CONFIG_FILE: /build/deploy/docker/oam-gui-bff.compose.json
    volumes:
      - certs_data:/build/certs
      # ADR-0453: every NF service gets this -- see this file's own header note (top of
      # file) for why. Bind mount, not a Dockerfile COPY, so editing config/<nf>.json on the
      # host takes effect on container restart without an image rebuild.
      - ../../config:/build/config:ro
      # Bind-mounted individually (not the whole certs/oam-operator-ca or certs/oam-gui-bff
      # directory): these two files are the ONLY pieces of the operator-facing PKI/OIDC-secret
      # this compose file does not itself provision, and mounting just them leaves the
      # certs_data-provisioned oam-gui-bff/{cert,key}.pem (this NF's own lab-CA identity, used for
      # every outbound service call including to keycloak) untouched. LONG syntax with
      # `create_host_path: false`, not the short `host:container:ro` form: the short form makes
      # Docker silently CREATE a root-owned DIRECTORY at the host path when the source file does
      # not exist yet (e.g. a fresh clone that has not run gui/scripts/gen-operator-pki.sh and
      # deploy/keycloak/render-realm.sh on the host first) -- the container would then still start
      # (mounting an empty directory where oam-gui-bff expects a file, failing later, confusingly,
      # inside the app instead of failing loudly here), and a later real run of those scripts would
      # fail trying to write a FILE where a root-owned directory the invoking user cannot remove
      # already sits. `create_host_path: false` makes a missing source fail the `up` immediately,
      # which is the honest failure mode: run the two host scripts first.
      - type: bind
        source: ../../certs/oam-operator-ca/ca.crt
        target: /build/certs/oam-operator-ca/ca.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../certs/oam-gui-bff/oidc-client-secret
        target: /build/certs/oam-gui-bff/oidc-client-secret
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "8710:8710"   # operator-facing HTTPS (TLS 1.3 + operator-CA mTLS + OIDC session)
      - "9510:9510"   # Prometheus /metrics

  # Real Redis/Valkey for CHF's own ChargingDataStore (ADR-0055/E3 persistence).
  # ADR-0355 (single broker) -> ADR-0443 (3-broker KRaft cluster, real replication). Apache Kafka
  # (Apache-2.0) -- no ZooKeeper. Redpanda was rejected: its core is BSL / Redpanda Community
  # licensed, neither OSI-approved (P1).
  #
  # Why 3 brokers, not 1: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR and every topic's own
  # replication.factor cannot exceed the broker count -- a real replication factor (durability
  # surviving one broker's loss) needs at least that many brokers to replicate ONTO. combined
  # broker+controller KRaft roles (same pattern the single-node service already used), one voter
  # each -- the minimum real (not single-point) KRaft controller quorum.
  #
  # Partition counts for chf.cdr and mfaf.notifications are set by kafka-topics-init below, not by
  # KAFKA_AUTO_CREATE_TOPICS_ENABLE (now "false", was "true"): auto-create hands a racing first
  # producer whatever num.partitions default applies (1) before this file's own sizing has run,
  # silently undersizing the topic it was never told to size -- ADR-0443 disables it and creates
  # both topics explicitly, sized.
  kafka-1: &kafka-broker
    image: apache/kafka:3.9.0
    environment: &kafka-broker-env
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      # Three listeners per broker: NFs/tools on the host reach 127.0.0.1:<broker's own HOST
      # port> (each broker needs a DIFFERENT host port -- they are different containers sharing
      # the host network namespace's loopback); every other broker and Doris' Routine Load, both
      # inside the compose network, reach <service>:29092. A single advertised address cannot
      # serve both -- the broker tells each client where to reconnect, and "127.0.0.1" means
      # something different inside a container than it does on the host.
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://127.0.0.1:9092,INTERNAL://kafka-1:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # 3 brokers -> a real replication factor for the internal __consumer_offsets topic too, not
      # just the topics this file provisions explicitly.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Lab-only: PLAINTEXT. A deployment puts TLS + SASL on the listener; CDRs are billing data.
    healthcheck: &kafka-broker-healthcheck
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    ports:
      - "9092:9092"

  kafka-2:
    <<: *kafka-broker
    environment:
      <<: *kafka-broker-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: HOST://127.0.0.1:9192,INTERNAL://kafka-2:29092
    ports:
      - "9192:9092"

  kafka-3:
    <<: *kafka-broker
    environment:
      <<: *kafka-broker-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: HOST://127.0.0.1:9292,INTERNAL://kafka-3:29092
    ports:
      - "9292:9092"

  # ADR-0443. Runs once against the up cluster and exits: KAFKA_AUTO_CREATE_TOPICS_ENABLE is now
  # "false" (see kafka-1's own comment), so nothing else will create these topics.
  #
  # Sizing (docs/DECISIONS.md ADR-0443 has the full derivation):
  #   chf.cdr: Tier-1 target 300M CDRs/day = 3,472 CDRs/s average. Busy-hour concentration
  #   (disclosed assumption, not a measured or 3GPP-specified figure: ~15% of a day's traffic in
  #   its single busiest hour, a common telecom capacity-planning rule of thumb) -> 12,500 CDRs/s
  #   sustained peak; x2 disclosed burst/growth headroom -> 25,000 CDRs/s design target. Divided by
  #   a DISCLOSED, NOT independently measured, conservative per-partition throughput assumption of
  #   3,000 msgs/s (KB-sized JSON, acks=all, idempotent producer, shared/modest hardware -- in the
  #   range commonly cited in published Kafka sizing guidance, not this project's own benchmark) ->
  #   ceil(25,000/3,000) = 9, already a clean multiple of the 3-broker count (3 leader-partitions
  #   per broker). ADR-0443's PROOF STATUS ran a real kafka-producer-perf-test.sh against this same
  #   cluster and topic and reports what it found -- explicitly NOT as this sizing's basis, since
  #   that run shared the machine with a live CI build under heavy contention.
  #   mfaf.notifications: no documented rate (ADR-0443 flags this, does not invent one); sized
  #   instead for consumer-group parallelism headroom (partition count upper-bounds how many MFAF
  #   replicas can consume the topic concurrently, docs/DECISIONS.md ADR-0365).
  #   Both: replication.factor=3 (every broker), min.insync.replicas=2 (acks=all then genuinely
  #   waits for a second broker, not just the leader, before acknowledging).
  kafka-topics-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:29092 --create --if-not-exists \
          --topic chf.cdr --partitions 9 --replication-factor 3 \
          --config min.insync.replicas=2
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:29092 --create --if-not-exists \
          --topic mfaf.notifications --partitions 6 --replication-factor 3 \
          --config min.insync.replicas=2
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:29092 --describe

  # ADR-0044 mandated Valkey; the lab was still on redis:7-alpine, which resolves to Redis 7.4 --
  # the first version under RSALv2/SSPL, not OSI-approved (P1). Caught by the architecture
  # diagram's license table (ADR-0356). Valkey is BSD-3-Clause and RESP-compatible: no client change.
  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ADR-0443, cut over by ADR-0451: a real Valkey Cluster, additive to the single-node `valkey`
  # above -- every NF except UDSF (AMF, AUSF, CHF, ADRF, NWDAF, DCCF, LI-MDF, MFAF) keeps using the
  # single-node service, unchanged, on purpose: their store code talks to Valkey through
  # sw::redis::Redis, which has no MOVED/ASK-redirect handling, so pointing it at one node of a
  # real cluster would silently serve only the ~1/N of keys that happen to hash to that node's own
  # slot range and error on the rest -- a real gap ADR-0443 disclosed rather than hid behind a
  # cluster that would only actually have one usable shard. UDSF is the one NF whose CODE was
  # converted (store.hpp's RedisRouter, built on sw::redis::RedisCluster, which does handle
  # redirects) -- ADR-0443 left its own compose entry on `redis_mode=single` anyway, since its own
  # PROOF STATUS used a standalone harness against these 6 nodes directly instead of the real
  # service. ADR-0451 finishes that: UDSF's compose entry below now actually points at this
  # cluster. Opt another converted NF in the same way: point <NF>_REDIS_URL at
  # valkey-cluster-1:6379 and set <NF>_REDIS_MODE=cluster -- nothing else here is converted yet.
  #
  # 3 masters + 1 replica each = 6 nodes: the minimum real (not single-shard) Valkey/Redis Cluster
  # topology -- Redis Cluster needs at least 3 master nodes to hold quorum for slot/failover
  # decisions, and a shard with no replica has no failover at all. Shard COUNT here is sized to
  # prove real multi-shard routing and per-shard failover, not against a measured UDSF ops/memory
  # budget (no such figure is documented the way chf.cdr's CDR/day figure is -- ADR-0443 says so
  # plainly rather than inventing one).
  #
  # ADR-0451: `--appendonly yes` (was `no`) -- ADR-0445's own debt list named this directly ("the
  # 6-node Valkey Cluster has AOF disabled"). UDSF's data (PCF/SMF session context, exposure
  # subscriptions) is real operational state a restart must not silently lose; AOF is the real
  # fix, not RDB snapshotting alone (which loses everything since the last snapshot on a crash).
  valkey-cluster-1: &valkey-cluster-node
    image: valkey/valkey:8-alpine
    command: >
      valkey-server --cluster-enabled yes --cluster-config-file /data/nodes.conf
      --cluster-node-timeout 5000 --appendonly yes
    healthcheck: &valkey-cluster-node-healthcheck
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "7001:6379"
  valkey-cluster-2:
    <<: *valkey-cluster-node
    ports:
      - "7002:6379"
  valkey-cluster-3:
    <<: *valkey-cluster-node
    ports:
      - "7003:6379"
  valkey-cluster-4:
    <<: *valkey-cluster-node
    ports:
      - "7004:6379"
  valkey-cluster-5:
    <<: *valkey-cluster-node
    ports:
      - "7005:6379"
  valkey-cluster-6:
    <<: *valkey-cluster-node
    ports:
      - "7006:6379"

  # Runs `--cluster create` once, against all 6 nodes' own container IPs on the compose network
  # (valkey-cli resolves them by service DNS name here; the resulting CLUSTER SLOTS map itself is
  # published to every node's nodes.conf, and the value that ends up ANNOUNCED to a client is each
  # node's own container IP, not its service name -- ADR-0443 discloses whether that was reachable
  # from the host for this pass's proof). --cluster-replicas 1 with 6 nodes listed pairs each
  # master with the next node as its replica (valkey-cli's own default assignment order).
  valkey-cluster-init:
    image: valkey/valkey:8-alpine
    depends_on:
      valkey-cluster-1:
        condition: service_healthy
      valkey-cluster-2:
        condition: service_healthy
      valkey-cluster-3:
        condition: service_healthy
      valkey-cluster-4:
        condition: service_healthy
      valkey-cluster-5:
        condition: service_healthy
      valkey-cluster-6:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        valkey-cli --cluster create \
          valkey-cluster-1:6379 valkey-cluster-2:6379 valkey-cluster-3:6379 \
          valkey-cluster-4:6379 valkey-cluster-5:6379 valkey-cluster-6:6379 \
          --cluster-replicas 1 --cluster-yes
        valkey-cli -h valkey-cluster-1 cluster nodes

  # Real, self-hosted, open-source Apache Doris for CHF's CDR generation (ADR-0058, P4.4;
  # ADR-0192 records the migration and the full engine comparison). `all-in-one` is a real,
  # official apache/doris image (FE+BE in one container, confirmed via Docker Hub + the image's
  # own real entrypoint.sh, not guessed) --
  # matches this project's own single-container-per-datastore convention (like postgres/redis
  # above) rather than the also-real, more-production-shaped separate FE+BE deployment. Real,
  # confirmed default credentials: root user, no password (lab-only, same disclosed shape as this
  # project's own CHF PostgreSQL trust-auth precedent, ADR-0060) -- FE's own real MySQL-protocol
  # query port is 9030, not an HTTP data port.
  doris:
    image: apache/doris:all-in-one-4.1.3
    ports:
      - "8030:8030"   # FE HTTP (/api/health)
      - "9030:9030"   # FE MySQL protocol (real query port CHF connects to)
      - "8040:8040"   # BE HTTP (stream load)
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8030/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Doris's own official image has no `/docker-entrypoint-initdb.d/`-style auto-init convention
  # the way postgres/the pre-migration image did (real, confirmed absence, not assumed) -- schema
  # apply is a real, explicit one-shot step instead, same "dependency completes, then CHF starts"
  # shape as this file's own pre-existing `pki-init` service. `mariadb:11` is a real, standard,
  # lightweight image that bundles the real `mysql` CLI client Doris's own MySQL-protocol FE
  # accepts it from.
  doris-schema-init:
    image: mariadb:11
    depends_on:
      doris:
        condition: service_healthy
    volumes:
      - ../../nfs/chf/schema.doris.sql:/schema.doris.sql:ro
      - ../../nfs/adrf/schema.doris.sql:/adrf-schema.doris.sql:ro
      - ../../nfs/chf/schema.features.doris.sql:/features-schema.doris.sql:ro
    entrypoint:
      - /bin/bash
      - -c
      # `mariadb`, not `mysql`: the mariadb:11 image dropped the mysql-named symlinks, so the
      # one-shot had been exiting 127 (found while bringing the ADRF's database up, ADR-0367).
      - "mariadb -h doris -P 9030 -u root --skip-ssl -e 'CREATE DATABASE IF NOT EXISTS chf_cdr' && mariadb -h doris -P 9030 -u root --skip-ssl chf_cdr < /schema.doris.sql && mariadb -h doris -P 9030 -u root --skip-ssl -e 'CREATE DATABASE IF NOT EXISTS adrf_data' && mariadb -h doris -P 9030 -u root --skip-ssl adrf_data < /adrf-schema.doris.sql && mariadb -h doris -P 9030 -u root --skip-ssl -e 'CREATE DATABASE IF NOT EXISTS chf_features' && mariadb -h doris -P 9030 -u root --skip-ssl chf_features < /features-schema.doris.sql"

  chf:
    build:
      context: ../..
      dockerfile: deploy/docker/chf.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
      valkey:
        condition: service_healthy
      doris-schema-init:
        condition: service_completed_successfully
      postgres-chf:
        condition: service_healthy
      product-catalog:
        condition: service_started
      balance-management:
        condition: service_started
    environment:
      CHF_REDIS_URL: tcp://valkey:6379
      CHF_DORIS_HOST: doris
      CHF_DORIS_PORT: "9030"
      CHF_DORIS_USER: root
      CHF_DORIS_DATABASE: chf_cdr
      # ADR-0388: the consolidated charging DB, schema chf_rating.
      CHF_RATING_DATABASE_URL: postgresql://postgres@postgres-chf:5432/charging
      # ADR-0077 retrofit: same real cross-container bug AMF/UDR's own *_NRF_BASE_URL already fixed
      # (127.0.0.1 inside this container is chf's own loopback, not nrf's).
      CHF_NRF_BASE_URL: https://nrf:7777
      # Real bug found and fixed while live-verifying this file (nfs/chf/src/charging_engine.cpp):
      # these were hardcoded to 127.0.0.1, which is CHF's own container in this compose network,
      # not product-catalog's/balance-management's -- CHF could never reach either service without
      # this override once they became separate containers.
      CHF_PRODUCT_CATALOG_BASE: https://product-catalog:7785
      CHF_BALANCE_MANAGEMENT_BASE: https://balance-management:7786
      # P4.8/ADR-0074: real kill switch, defaults OFF -- a fresh checkout has no trained model
      # until nfs/chf/training/train_quota_sizing.py is actually run (see .gitignore's own
      # comment on nfs/chf/training/models/), so this must not silently default to "on" against a
      # model file that doesn't exist. Override via `CHF_AI_QUOTA_SIZING_ENABLED=true docker
      # compose up` once a real model has been trained into the mounted models/ directory below.
      CHF_AI_QUOTA_SIZING_ENABLED: "${CHF_AI_QUOTA_SIZING_ENABLED:-false}"
      CHF_QUOTA_MODEL_PATH: /build/models/quota_sizing.onnx
      # ADR-0150: optional override for the inference latency budget (microseconds), defaults to
      # chf::kDefaultAiQuotaLatencyBudget (50000us) if unset -- see ai_inference.hpp's own header
      # comment for why that default was raised from the original 5000us.
      CHF_AI_QUOTA_LATENCY_BUDGET_US: "${CHF_AI_QUOTA_LATENCY_BUDGET_US:-50000}"
    volumes:
      - certs_data:/build/certs
      # ADR-0453: every NF service gets this -- see this file's own header note (top of
      # file) for why. Bind mount, not a Dockerfile COPY, so editing config/<nf>.json on the
      # host takes effect on container restart without an image rebuild.
      - ../../config:/build/config:ro
      - ../../nfs/chf/training/models:/build/models:ro
    ports:
      - "7784:7784" # Nchf_ConvergedCharging + Nchf_OfflineOnlyCharging + Nchf_SpendingLimitControl
      - "3868:3868" # Diameter Gy + Rf + Sy (ADR-0059)
      - "9472:9472" # Prometheus /metrics
      # CAP (port 2905) is deliberately NOT host-published here: Docker's `ports:` short syntax
      # only accepts tcp/udp, and SCTP does not traverse Docker's userland-proxy/iptables NAT the
      # way tcp/udp do -- a real, disclosed Docker networking limitation, not this project's own
      # gap. Container-to-container SCTP on the shared compose bridge network works fine (direct
      # L3 hop, no NAT); a real SS7 peer container reaching CHF for lab testing should join this
      # same compose network and dial `chf:2905` directly, not a host-published port.

  subscriber-management:
    build:
      context: ../..
      dockerfile: deploy/docker/subscriber-management.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      postgres-chf:
        condition: service_healthy
    environment:
      # ADR-0386: the consolidated charging DB, schemas party + subscriber_mgmt.
      SUBSCRIBER_MANAGEMENT_DATABASE_URL: postgresql://postgres@postgres-chf:5432/charging
      # ADR-0077 retrofit: same class of self-referential-URL fix as balance-management's own.
      SUBSCRIBER_MANAGEMENT_SELF_BASE_URL: https://subscriber-management:7787
    volumes:
      - certs_data:/build/certs
      # ADR-0453: every NF service gets this -- see this file's own header note (top of
      # file) for why. Bind mount, not a Dockerfile COPY, so editing config/<nf>.json on the
      # host takes effect on container restart without an image rebuild.
      - ../../config:/build/config:ro
    ports:
      - "7787:7787"   # TMF632 Party Management + E1/E10 (TLS 1.3 + mTLS)
      - "9475:9475"   # Prometheus /metrics

  roaming-interconnect:
    build:
      context: ../..
      dockerfile: deploy/docker/roaming-interconnect.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      postgres-chf:
        condition: service_healthy
    environment:
      # ADR-0387: the consolidated charging DB, schemas subscriber_mgmt (TMF651) + roaming.
      ROAMING_INTERCONNECT_DATABASE_URL: postgresql://postgres@postgres-chf:5432/charging
      # ADR-0077 retrofit: same class of self-referential-URL fix as balance-management's own.
      ROAMING_INTERCONNECT_SELF_BASE_URL: https://roaming-interconnect:7788
    volumes:
      - certs_data:/build/certs
      # ADR-0453: every NF service gets this -- see this file's own header note (top of
      # file) for why. Bind mount, not a Dockerfile COPY, so editing config/<nf>.json on the
      # host takes effect on container restart without an image rebuild.
      - ../../config:/build/config:ro
    ports:
      - "7788:7788"   # TMF651 Agreement Management, E7 InterconnectAgreement (TLS 1.3 + mTLS)
      - "9476:9476"   # Prometheus /metrics

  # --- Database management GUIs (dev/ops consoles; web UIs on the lab network) ---
  # Kafka console: browse topics (chf.cdr), messages, consumer groups. http://localhost:8080
  kafka-ui:
    image: kafbat/kafka-ui:latest
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: lab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
    ports:
      - "8080:8080"
    restart: unless-stopped

  # Valkey/Redis console. http://localhost:5540 -- add a DB with host=valkey port=6379 (no password).
  redisinsight:
    image: redis/redisinsight:latest
    depends_on:
      valkey:
        condition: service_healthy
    ports:
      - "5540:5540"
    restart: unless-stopped

volumes:
  certs_data:
  postgres_chf_data:
  postgres_udr_data:
  postgres_adrf_data:
  postgres_li_data:
  nwdaf_training_data:   # ADR-0369: the MTLF's trained models, reports and MLflow lineage
