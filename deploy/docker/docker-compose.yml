  # ADR-0462: the ADMF -- LI_HI1 receiver for the LEA (ETSI TS 103 120) and X1 client of the POIs and
  # the MDF2. Deliberately NOT an SBI NF: it registers with no NRF (TS 33.127 keeps LI off the service
  # plane). Warrant state is its own PostgreSQL (postgres-li). ONE replica only: the reconcile loop
