# Lab bring-up for the NFs built so far. Run from the repo root:
#   docker compose -f deploy/docker/docker-compose.yml up --build
#
# PKI is provisioned ONCE by pki-init into the shared certs_data volume, which every NF container
# mounts read-write at /build/certs. This replaced an earlier design where each NF generated its
# own lab PKI independently at container start (fine with only one NF/container in the compose
# file, which is all that existed then) -- discovered broken while adding amf as a second
# container: two independently-generated CAs would not trust each other's leaf certs, so the mTLS
# handshake between nrf and amf would fail. See docs/DECISIONS.md ADR-0019.

services:
  pki-init:
    image: ubuntu:24.04
    working_dir: /build
    volumes:
      - certs_data:/build/certs
      - ../../scripts:/build/scripts:ro
    entrypoint:
      - /bin/bash
      - -c
      - "apt-get update >/dev/null && apt-get install -y --no-install-recommends openssl >/dev/null && ./scripts/gen-lab-pki.sh nrf amf smf udm udr ausf pcf nssf bsf nef scp eir nsacf smsf gmlc lmf product-catalog balance-management chf subscriber-management roaming-interconnect nwdaf mfaf dccf adrf li-mdf"

  nrf:
    build:
      context: ../..
      dockerfile: deploy/docker/nrf.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
    volumes:
      - certs_data:/build/certs
    ports:
      - "7777:7777"   # Nnrf_NFManagement / Nnrf_NFDiscovery / Nnrf_AccessToken (TLS 1.3 + mTLS)
      - "9464:9464"   # Prometheus /metrics

  amf:
    build:
      context: ../..
      dockerfile: deploy/docker/amf.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
      valkey:
        condition: service_healthy
    # docs/DECISIONS.md ADR-0077: config/amf.json's own defaults (127.0.0.1) are for direct
    # binary/lab runs; these two env vars override per-key for compose's own bridge-network
    # DNS names, same pattern CHF's own CHF_REDIS_URL already used below. Real, pre-existing
    # latent bug found while wiring this (not introduced by this change, and not fixed for the
    # other already-composed NFs yet -- see task #109): every other NF's own hardcoded
    # "127.0.0.1:7777" NRF base URL would not actually resolve across separate compose
    # containers either, since compose's default bridge network gives each container its own
    # loopback.
    environment:
      AMF_NRF_BASE_URL: https://nrf:7777
      AMF_REDIS_URL: tcp://valkey:6379
    volumes:
      - certs_data:/build/certs
    ports:
      - "7778:7778"   # Namf_Communication (TLS 1.3 + mTLS)
      - "9465:9465"   # Prometheus /metrics
      - "7807:7807"   # LI_X1 provisioning for the AMF IRI-POI (ADR-0377; bound only when li_poi.enabled)

  smf:
    build:
      context: ../..
      dockerfile: deploy/docker/smf.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
    volumes:
      - certs_data:/build/certs
    ports:
      - "7779:7779"   # Nsmf_PDUSession /sm-contexts (TLS 1.3 + mTLS)
      - "9466:9466"   # Prometheus /metrics

  udm:
    build:
      context: ../..
      dockerfile: deploy/docker/udm.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
      # ADR-0069 (gap-closure Tier 1b): GetAmData/GetSmfSelData/GetSmData now make real
      # Nudr_DataRepository calls -- same "depends_on the NF it real-calls" pattern ausf's own
      # dependency on udm already established.
      udr:
        condition: service_started
    volumes:
      - certs_data:/build/certs
    ports:
      - "7780:7780"   # Nudm_UECM / Nudm_SDM (TLS 1.3 + mTLS)
      - "9467:9467"   # Prometheus /metrics

  # Real PostgreSQL for UDR's context-data persistence (ADR-0068, gap-closure Tier 1a) -- own
  # dedicated instance, same "one postgres per consumer" shape as every other PostgreSQL-backed
  # service in this compose file.
  postgres-udr:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: udr
      POSTGRES_PASSWORD: udr
      POSTGRES_DB: udr
    volumes:
      - postgres_udr_data:/var/lib/postgresql/data
      - ../../nfs/udr/schema.postgres.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U udr"]
      interval: 5s
      timeout: 5s
      retries: 10

  udr:
    build:
      context: ../..
      dockerfile: deploy/docker/udr.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
      postgres-udr:
        condition: service_healthy
    environment:
      UDR_DATABASE_URL: postgresql://udr:udr@postgres-udr:5432/udr
      # ADR-0077 retrofit: same real cross-container bug AMF's own AMF_NRF_BASE_URL already fixed
      # (127.0.0.1 inside this container is udr's own loopback, not nrf's).
      UDR_NRF_BASE_URL: https://nrf:7777
    volumes:
      - certs_data:/build/certs
    ports:
      - "7781:7781"   # Nudr_DataRepository context-data group (TLS 1.3 + mTLS)
      - "9468:9468"   # Prometheus /metrics

  ausf:
    build:
      context: ../..
      dockerfile: deploy/docker/ausf.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
      udm:
        condition: service_started
    volumes:
      - certs_data:/build/certs
    ports:
      - "7782:7782"   # Nausf_UEAuthentication ue-authentications group (TLS 1.3 + mTLS)
      - "9469:9469"   # Prometheus /metrics

  pcf:
    build:
      context: ../..
      dockerfile: deploy/docker/pcf.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
    volumes:
      - certs_data:/build/certs
    ports:
      - "7783:7783"   # Npcf_AMPolicyControl / Npcf_SMPolicyControl (TLS 1.3 + mTLS)
      - "9470:9470"   # Prometheus /metrics

  nssf:
    build:
      context: ../..
      dockerfile: deploy/docker/nssf.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
    volumes:
      - certs_data:/build/certs
    ports:
      - "7785:7785"   # Nnssf_NSSelection / Nnssf_NSSAIAvailability (TLS 1.3 + mTLS)
      - "9473:9473"   # Prometheus /metrics

  bsf:
    build:
      context: ../..
      dockerfile: deploy/docker/bsf.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
    volumes:
      - certs_data:/build/certs
    ports:
      - "7789:7789"   # Nbsf_Management (TLS 1.3 + mTLS)
      - "9477:9477"   # Prometheus /metrics

  nef:
    build:
      context: ../..
      dockerfile: deploy/docker/nef.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
    volumes:
      - certs_data:/build/certs
    ports:
      - "7790:7790"   # Nnef_PFDmanagement (TLS 1.3 + mTLS)
      - "9478:9478"   # Prometheus /metrics

  scp:
    build:
      context: ../..
      dockerfile: deploy/docker/scp.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
    volumes:
      - certs_data:/build/certs
    ports:
      - "7791:7791"   # Nscp_EventExposure (TLS 1.3 + mTLS)
      - "9479:9479"   # Prometheus /metrics

  eir:
    build:
      context: ../..
      dockerfile: deploy/docker/eir.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
    volumes:
      - certs_data:/build/certs
    ports:
      - "7792:7792"   # N5g-eir_EquipmentIdentityCheck (TLS 1.3 + mTLS)
      - "9480:9480"   # Prometheus /metrics

  nsacf:
    build:
      context: ../..
      dockerfile: deploy/docker/nsacf.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
    volumes:
      - certs_data:/build/certs
    ports:
      - "7797:7797"   # Nnsacf_NSAC + Nnsacf_SliceEventExposure (TLS 1.3 + mTLS)
      - "9484:9484"   # Prometheus /metrics

  # ADR-0358/0368/0369: the NWDAF containing AnLF -- Nnwdaf_AnalyticsInfo, EventsSubscription,
  # DataManagement; collects via the DCCF; takes its NF_LOAD model from nwdaf-mtlf below and
  # infers in-process (ONNX Runtime). One binary, `NWDAF_ROLE` selects the logical function.
  nwdaf:
    build:
      context: ../..
      dockerfile: deploy/docker/nwdaf.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
      doris:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      NWDAF_ROLE: anlf
      NWDAF_FEATURE_STORE_HOST: doris
      NWDAF_REDIS_URL: tcp://valkey:6379   # ADR-0360: subscription state shared across replicas
      NWDAF_SELF_BASE_URL: https://nwdaf:7798   # ADR-0368: where the DCCF's deliveries land
      NWDAF_DCCF_BASE_URL: https://dccf:7803
      NWDAF_MTLF_BASE_URL: https://nwdaf-mtlf:7797   # ADR-0369: Nnwdaf_MLModelProvision
      NWDAF_ADRF_BASE_URL: https://adrf:7804         # ADR-0369: model retrieval
    volumes:
      - certs_data:/build/certs
    ports:
      - "7798:7798"   # Nnwdaf_AnalyticsInfo + EventsSubscription + DataManagement (TLS 1.3 + mTLS)
      - "9485:9485"   # Prometheus /metrics

  # ADR-0369: the NWDAF containing MTLF -- Nnwdaf_MLModelProvision. Trains the NF_LOAD model
  # through the Python sidecar baked into the same image (/opt/nwdaf-training, its own venv),
  # on the data the ADRF stores from the AnLF, stores every model through Nadrf_MLModelManagement
  # and tracks every run in MLflow (SQLite on the volume below; point
  # NWDAF_TRAINING_MLFLOW_TRACKING_URI at a self-hosted MLflow server to share lineage).
  nwdaf-mtlf:
    build:
      context: ../..
      dockerfile: deploy/docker/nwdaf.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
      adrf:
        condition: service_started
      valkey:
        condition: service_healthy
    environment:
      NWDAF_ROLE: mtlf
      NWDAF_PORT: "7797"
      NWDAF_METRICS_BIND_ADDRESS: 0.0.0.0:9486
      NWDAF_FEATURE_STORE_HOST: doris
      NWDAF_REDIS_URL: tcp://valkey:6379
      NWDAF_SELF_BASE_URL: https://nwdaf-mtlf:7797
      NWDAF_DCCF_BASE_URL: https://dccf:7803
      NWDAF_ADRF_BASE_URL: https://adrf:7804
      NWDAF_TRAINING_PYTHON: /opt/nwdaf-training/.venv/bin/python3
      NWDAF_TRAINING_SCRIPT: /opt/nwdaf-training/train_nf_load.py
      NWDAF_TRAINING_WORKDIR: /var/lib/nwdaf/training
      NWDAF_TRAINING_MLFLOW_TRACKING_URI: sqlite:////var/lib/nwdaf/training/mlflow.db
    volumes:
      - certs_data:/build/certs
      - nwdaf_training_data:/var/lib/nwdaf/training
    ports:
      - "7797:7797"   # Nnwdaf_MLModelProvision (TLS 1.3 + mTLS)
      - "9486:9486"   # Prometheus /metrics

  # MDF2 -- Mediation and Delivery Function for IRI (ADR-0377). Deliberately has no NRF
  # dependency: TS 33.127 keeps the LI architecture off the service-based plane, so this NF
  # registers with nothing and is discoverable only to the ADMF that provisions it over X1.
  li-mdf:
    build:
      context: ../..
      dockerfile: deploy/docker/li-mdf.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    environment:
      LI_MDF_REDIS_URL: tcp://valkey:6379
    volumes:
      - certs_data:/build/certs
    ports:
      - "7805:7805"   # LI_X1 provisioning from the ADMF (TLS 1.3 + mTLS)
      - "7806:7806"   # LI_X2 from the IRI-POIs (TLS 1.3 + mTLS)
      - "9491:9491"   # Prometheus /metrics

  # ADR-0365: MFAF -- the TS 23.288 Messaging Framework Adaptor over Kafka; state in Valkey.
  # Replicate with `docker compose up --scale mfaf=N`: replicas share Valkey and join one Kafka
  # consumer group, so every configuration is visible everywhere and each notification is
  # delivered once.
  mfaf:
    build:
      context: ../..
      dockerfile: deploy/docker/mfaf.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
      kafka:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      MFAF_REDIS_URL: tcp://valkey:6379
      MFAF_EVENT_BUS_BROKERS: kafka:9092
      MFAF_ADVERTISED_IPV4: mfaf
    volumes:
      - certs_data:/build/certs
    ports:
      - "7800:7800"   # Nmfaf_3daDataManagement + ContextManagement + inbound/fetch (TLS 1.3 + mTLS)
      - "9487:9487"   # Prometheus /metrics

  # ADR-0366: DCCF -- data collection coordination; one source subscription per data spec,
  # fanned out through the MFAF; state in Valkey (stateless replicas, --scale dccf=N).
  dccf:
    build:
      context: ../..
      dockerfile: deploy/docker/dccf.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
      mfaf:
        condition: service_started
      valkey:
        condition: service_healthy
    environment:
      DCCF_REDIS_URL: tcp://valkey:6379
      DCCF_ADVERTISED_IPV4: dccf
      DCCF_MFAF_BASE_URL: https://mfaf:7800
      DCCF_AMF_BASE_URL: https://amf:7778
      DCCF_NSACF_BASE_URL: https://nsacf:7797
      DCCF_NWDAF_BASE_URL: https://nwdaf:7798
    volumes:
      - certs_data:/build/certs
    ports:
      - "7803:7803"   # Ndccf_DataManagement + Ndccf_ContextManagement (TLS 1.3 + mTLS)
      - "9489:9489"   # Prometheus /metrics

  # ADR-0367: the ADRF's ML model store -- its own PostgreSQL (one datastore per NF, as UDR,
  # CHF, the BSS services each have theirs); model bytes live here so every ADRF replica serves
  # every model. Data/analytics records go to Doris (adrf_data, doris-schema-init above).
  postgres-adrf:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adrf
      POSTGRES_PASSWORD: adrf
      POSTGRES_DB: adrf
    volumes:
      - postgres_adrf_data:/var/lib/postgresql/data
      - ../../nfs/adrf/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5438:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adrf"]
      interval: 5s
      timeout: 5s
      retries: 10

  adrf:
    build:
      context: ../..
      dockerfile: deploy/docker/adrf.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
      dccf:
        condition: service_started
      doris-schema-init:
        condition: service_completed_successfully
      postgres-adrf:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      ADRF_REDIS_URL: tcp://valkey:6379
      ADRF_ADVERTISED_IPV4: adrf
      ADRF_SELF_BASE_URL: https://adrf:7804
      ADRF_DCCF_BASE_URL: https://dccf:7803
      ADRF_NWDAF_BASE_URL: https://nwdaf:7798
      ADRF_DATA_STORE_HOST: doris
      ADRF_ML_MODEL_STORE_DATABASE_URL: postgresql://adrf:adrf@postgres-adrf:5432/adrf
    volumes:
      - certs_data:/build/certs
    ports:
      - "7804:7804"   # Nadrf_DataManagement + Nadrf_MLModelManagement (TLS 1.3 + mTLS)
      - "9490:9490"   # Prometheus /metrics

  smsf:
    build:
      context: ../..
      dockerfile: deploy/docker/smsf.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
    volumes:
      - certs_data:/build/certs
    ports:
      - "7793:7793"   # Nsmsf_SMService (TLS 1.3 + mTLS)
      - "9481:9481"   # Prometheus /metrics

  gmlc:
    build:
      context: ../..
      dockerfile: deploy/docker/gmlc.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
    volumes:
      - certs_data:/build/certs
    ports:
      - "7794:7794"   # Ngmlc_Location (TLS 1.3 + mTLS)
      - "9482:9482"   # Prometheus /metrics

  lmf:
    build:
      context: ../..
      dockerfile: deploy/docker/lmf.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
    volumes:
      - certs_data:/build/certs
    ports:
      - "7795:7795"   # Nlmf_Location (TLS 1.3 + mTLS)
      - "9483:9483"   # Prometheus /metrics

  # Real PostgreSQL for bss/product-catalog's persistence (ADR-0054) -- not a 3GPP NF, so it has no
  # pki-init dependency of its own for this service, but product-catalog (below) still needs the
  # shared CA like every other container.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: product_catalog
      POSTGRES_PASSWORD: product_catalog
      POSTGRES_DB: product_catalog
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../bss/product-catalog/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_catalog"]
      interval: 5s
      timeout: 5s
      retries: 10

  product-catalog:
    build:
      context: ../..
      dockerfile: deploy/docker/product-catalog.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      postgres-chf:
        condition: service_healthy
    environment:
      # ADR-0384: the consolidated charging DB, schema product_catalog (normalized TMF620 model).
      PRODUCT_CATALOG_DATABASE_URL: postgresql://postgres@postgres-chf:5432/charging
    volumes:
      - certs_data:/build/certs
    ports:
      - "7785:7785"   # TMF620 Product Catalog Management (TLS 1.3 + mTLS)
      - "9473:9473"   # Prometheus /metrics

  # Real PostgreSQL for bss/balance-management's persistence (ADR-0056) -- own dedicated instance,
  # same "one postgres per consumer" shape as the `postgres` service above (product-catalog's own),
  # not a shared multi-database instance.
  postgres-balance:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: balance_management
      POSTGRES_PASSWORD: balance_management
      POSTGRES_DB: balance_management
    volumes:
      - postgres_balance_data:/var/lib/postgresql/data
      - ../../bss/balance-management/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balance_management"]
      interval: 5s
      timeout: 5s
      retries: 10

  balance-management:
    build:
      context: ../..
      dockerfile: deploy/docker/balance-management.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      postgres-chf:
        condition: service_healthy
    environment:
      # ADR-0385: the consolidated charging DB, schema balance_mgmt.
      BALANCE_MANAGEMENT_DATABASE_URL: postgresql://postgres@postgres-chf:5432/charging
      # ADR-0077 retrofit: self_base_url is embedded in this service's own response payloads
      # (resource href/id) -- 127.0.0.1 inside this container is not reachable from any other
      # container, same class of bug as the *_NRF_BASE_URL fixes elsewhere in this file.
      BALANCE_MANAGEMENT_SELF_BASE_URL: https://balance-management:7786
    volumes:
      - certs_data:/build/certs
    ports:
      - "7786:7786"   # TMF654 Prepay Balance Management (TLS 1.3 + mTLS)
      - "9474:9474"   # Prometheus /metrics

  # Real PostgreSQL for CHF's RatingDecision audit table (ADR-0060 E5) -- own dedicated instance,
  # matching CHF's own real default conninfo (postgresql://postgres@.../chf_rating, no password --
  # POSTGRES_HOST_AUTH_METHOD=trust matches that real, disclosed lab-only credential shape).
  postgres-chf:
    image: postgres:16-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: chf_rating
    volumes:
      - postgres_chf_data:/var/lib/postgresql/data
      - ../../nfs/chf/schema.postgres.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      # ADR-0384: the consolidated domain DBs (charging, orchestration) on this same instance.
      - ../db:/domain-ddl:ro
      - ../db/init-domain-dbs.sh:/docker-entrypoint-initdb.d/20-domain-dbs.sh:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Real Redis/Valkey for CHF's own ChargingDataStore (ADR-0055/E3 persistence).
  # ADR-0355: the event bus. Apache Kafka (Apache-2.0) in KRaft mode -- no ZooKeeper. Redpanda
  # was rejected: its core is BSL / Redpanda Community licensed, neither OSI-approved (P1).
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Two listeners, because two kinds of client: NFs on the host reach 127.0.0.1:9092; Doris'
      # Routine Load, inside the compose network, reaches kafka:29092. A single advertised address
      # cannot serve both -- the broker tells each client where to connect, and "127.0.0.1" means
      # something different inside a container.
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://127.0.0.1:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Lab-only: PLAINTEXT. A deployment puts TLS + SASL on the listener; CDRs are billing data.
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  # ADR-0044 mandated Valkey; the lab was still on redis:7-alpine, which resolves to Redis 7.4 --
  # the first version under RSALv2/SSPL, not OSI-approved (P1). Caught by the architecture
  # diagram's license table (ADR-0356). Valkey is BSD-3-Clause and RESP-compatible: no client change.
  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Real, self-hosted, open-source Apache Doris for CHF's CDR generation (ADR-0058, P4.4;
  # ADR-0192 records the migration and the full engine comparison). `all-in-one` is a real,
  # official apache/doris image (FE+BE in one container, confirmed via Docker Hub + the image's
  # own real entrypoint.sh, not guessed) --
  # matches this project's own single-container-per-datastore convention (like postgres/redis
  # above) rather than the also-real, more-production-shaped separate FE+BE deployment. Real,
  # confirmed default credentials: root user, no password (lab-only, same disclosed shape as this
  # project's own CHF PostgreSQL trust-auth precedent, ADR-0060) -- FE's own real MySQL-protocol
  # query port is 9030, not an HTTP data port.
  doris:
    image: apache/doris:all-in-one-4.1.3
    ports:
      - "8030:8030"   # FE HTTP (/api/health)
      - "9030:9030"   # FE MySQL protocol (real query port CHF connects to)
      - "8040:8040"   # BE HTTP (stream load)
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8030/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Doris's own official image has no `/docker-entrypoint-initdb.d/`-style auto-init convention
  # the way postgres/the pre-migration image did (real, confirmed absence, not assumed) -- schema
  # apply is a real, explicit one-shot step instead, same "dependency completes, then CHF starts"
  # shape as this file's own pre-existing `pki-init` service. `mariadb:11` is a real, standard,
  # lightweight image that bundles the real `mysql` CLI client Doris's own MySQL-protocol FE
  # accepts it from.
  doris-schema-init:
    image: mariadb:11
    depends_on:
      doris:
        condition: service_healthy
    volumes:
      - ../../nfs/chf/schema.doris.sql:/schema.doris.sql:ro
      - ../../nfs/adrf/schema.doris.sql:/adrf-schema.doris.sql:ro
      - ../../nfs/chf/schema.features.doris.sql:/features-schema.doris.sql:ro
    entrypoint:
      - /bin/bash
      - -c
      # `mariadb`, not `mysql`: the mariadb:11 image dropped the mysql-named symlinks, so the
      # one-shot had been exiting 127 (found while bringing the ADRF's database up, ADR-0367).
      - "mariadb -h doris -P 9030 -u root --skip-ssl -e 'CREATE DATABASE IF NOT EXISTS chf_cdr' && mariadb -h doris -P 9030 -u root --skip-ssl chf_cdr < /schema.doris.sql && mariadb -h doris -P 9030 -u root --skip-ssl -e 'CREATE DATABASE IF NOT EXISTS adrf_data' && mariadb -h doris -P 9030 -u root --skip-ssl adrf_data < /adrf-schema.doris.sql && mariadb -h doris -P 9030 -u root --skip-ssl -e 'CREATE DATABASE IF NOT EXISTS chf_features' && mariadb -h doris -P 9030 -u root --skip-ssl chf_features < /features-schema.doris.sql"

  chf:
    build:
      context: ../..
      dockerfile: deploy/docker/chf.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
      valkey:
        condition: service_healthy
      doris-schema-init:
        condition: service_completed_successfully
      postgres-chf:
        condition: service_healthy
      product-catalog:
        condition: service_started
      balance-management:
        condition: service_started
    environment:
      CHF_REDIS_URL: tcp://valkey:6379
      CHF_DORIS_HOST: doris
      CHF_DORIS_PORT: "9030"
      CHF_DORIS_USER: root
      CHF_DORIS_DATABASE: chf_cdr
      CHF_RATING_DATABASE_URL: postgresql://postgres@postgres-chf:5432/chf_rating
      # ADR-0077 retrofit: same real cross-container bug AMF/UDR's own *_NRF_BASE_URL already fixed
      # (127.0.0.1 inside this container is chf's own loopback, not nrf's).
      CHF_NRF_BASE_URL: https://nrf:7777
      # Real bug found and fixed while live-verifying this file (nfs/chf/src/charging_engine.cpp):
      # these were hardcoded to 127.0.0.1, which is CHF's own container in this compose network,
      # not product-catalog's/balance-management's -- CHF could never reach either service without
      # this override once they became separate containers.
      CHF_PRODUCT_CATALOG_BASE: https://product-catalog:7785
      CHF_BALANCE_MANAGEMENT_BASE: https://balance-management:7786
      # P4.8/ADR-0074: real kill switch, defaults OFF -- a fresh checkout has no trained model
      # until nfs/chf/training/train_quota_sizing.py is actually run (see .gitignore's own
      # comment on nfs/chf/training/models/), so this must not silently default to "on" against a
      # model file that doesn't exist. Override via `CHF_AI_QUOTA_SIZING_ENABLED=true docker
      # compose up` once a real model has been trained into the mounted models/ directory below.
      CHF_AI_QUOTA_SIZING_ENABLED: "${CHF_AI_QUOTA_SIZING_ENABLED:-false}"
      CHF_QUOTA_MODEL_PATH: /build/models/quota_sizing.onnx
      # ADR-0150: optional override for the inference latency budget (microseconds), defaults to
      # chf::kDefaultAiQuotaLatencyBudget (50000us) if unset -- see ai_inference.hpp's own header
      # comment for why that default was raised from the original 5000us.
      CHF_AI_QUOTA_LATENCY_BUDGET_US: "${CHF_AI_QUOTA_LATENCY_BUDGET_US:-50000}"
    volumes:
      - certs_data:/build/certs
      - ../../nfs/chf/training/models:/build/models:ro
    ports:
      - "7784:7784" # Nchf_ConvergedCharging + Nchf_OfflineOnlyCharging + Nchf_SpendingLimitControl
      - "3868:3868" # Diameter Gy + Rf + Sy (ADR-0059)
      - "9472:9472" # Prometheus /metrics
      # CAP (port 2905) is deliberately NOT host-published here: Docker's `ports:` short syntax
      # only accepts tcp/udp, and SCTP does not traverse Docker's userland-proxy/iptables NAT the
      # way tcp/udp do -- a real, disclosed Docker networking limitation, not this project's own
      # gap. Container-to-container SCTP on the shared compose bridge network works fine (direct
      # L3 hop, no NAT); a real SS7 peer container reaching CHF for lab testing should join this
      # same compose network and dial `chf:2905` directly, not a host-published port.

  # Real PostgreSQL for bss/subscriber-management's persistence (P4.7, ADR-0060 E1/E10) -- own
  # dedicated instance, same "one postgres per consumer" shape as every other bss/* store.
  postgres-subscriber:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: subscriber_management
      POSTGRES_PASSWORD: subscriber_management
      POSTGRES_DB: subscriber_management
    volumes:
      - postgres_subscriber_data:/var/lib/postgresql/data
      - ../../bss/subscriber-management/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subscriber_management"]
      interval: 5s
      timeout: 5s
      retries: 10

  subscriber-management:
    build:
      context: ../..
      dockerfile: deploy/docker/subscriber-management.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      postgres-subscriber:
        condition: service_healthy
    environment:
      SUBSCRIBER_MANAGEMENT_DATABASE_URL: postgresql://subscriber_management:subscriber_management@postgres-subscriber:5432/subscriber_management
      # ADR-0077 retrofit: same class of self-referential-URL fix as balance-management's own.
      SUBSCRIBER_MANAGEMENT_SELF_BASE_URL: https://subscriber-management:7787
    volumes:
      - certs_data:/build/certs
    ports:
      - "7787:7787"   # TMF632 Party Management + E1/E10 (TLS 1.3 + mTLS)
      - "9475:9475"   # Prometheus /metrics

  # Real PostgreSQL for bss/roaming-interconnect's persistence (P4.7, ADR-0060 E7) -- own dedicated
  # instance, same "one postgres per consumer" shape as every other bss/* store.
  postgres-roaming:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: roaming_interconnect
      POSTGRES_PASSWORD: roaming_interconnect
      POSTGRES_DB: roaming_interconnect
    volumes:
      - postgres_roaming_data:/var/lib/postgresql/data
      - ../../bss/roaming-interconnect/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roaming_interconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

  roaming-interconnect:
    build:
      context: ../..
      dockerfile: deploy/docker/roaming-interconnect.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      postgres-roaming:
        condition: service_healthy
    environment:
      ROAMING_INTERCONNECT_DATABASE_URL: postgresql://roaming_interconnect:roaming_interconnect@postgres-roaming:5432/roaming_interconnect
      # ADR-0077 retrofit: same class of self-referential-URL fix as balance-management's own.
      ROAMING_INTERCONNECT_SELF_BASE_URL: https://roaming-interconnect:7788
    volumes:
      - certs_data:/build/certs
    ports:
      - "7788:7788"   # TMF651 Agreement Management, E7 InterconnectAgreement (TLS 1.3 + mTLS)
      - "9476:9476"   # Prometheus /metrics

  # --- Database management GUIs (dev/ops consoles; web UIs on the lab network) ---
  # Kafka console: browse topics (chf.cdr), messages, consumer groups. http://localhost:8080
  kafka-ui:
    image: kafbat/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: lab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8080:8080"
    restart: unless-stopped

  # Valkey/Redis console. http://localhost:5540 -- add a DB with host=valkey port=6379 (no password).
  redisinsight:
    image: redis/redisinsight:latest
    depends_on:
      valkey:
        condition: service_healthy
    ports:
      - "5540:5540"
    restart: unless-stopped

volumes:
  certs_data:
  postgres_data:
  postgres_balance_data:
  postgres_chf_data:
  postgres_subscriber_data:
  postgres_roaming_data:
  postgres_udr_data:
  postgres_adrf_data:
  nwdaf_training_data:   # ADR-0369: the MTLF's trained models, reports and MLflow lineage
