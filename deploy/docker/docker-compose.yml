      # ADR-0453: every NF service gets this -- see this file's own header note (top of
      # file) for why. Bind mount, not a Dockerfile COPY, so editing config/<nf>.json on the
      # host takes effect on container restart without an image rebuild.
      - ../../config:/build/config:ro
    ports:
      - "7793:7793"   # Nsmsf_SMService (TLS 1.3 + mTLS)
      - "9481:9481"   # Prometheus /metrics

  gmlc:
    build:
      context: ../..
      dockerfile: deploy/docker/gmlc.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
    volumes:
      - certs_data:/build/certs
      # ADR-0453: every NF service gets this -- see this file's own header note (top of
      # file) for why. Bind mount, not a Dockerfile COPY, so editing config/<nf>.json on the
      # host takes effect on container restart without an image rebuild.
      - ../../config:/build/config:ro
    ports:
      - "7794:7794"   # Ngmlc_Location (TLS 1.3 + mTLS)
      - "9482:9482"   # Prometheus /metrics

  lmf:
    build:
      context: ../..
      dockerfile: deploy/docker/lmf.Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      nrf:
        condition: service_started
    volumes:
      - certs_data:/build/certs
      # ADR-0453: every NF service gets this -- see this file's own header note (top of
      # file) for why. Bind mount, not a Dockerfile COPY, so editing config/<nf>.json on the
